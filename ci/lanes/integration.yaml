schema_version: 1
name: integration
commands:
  - python3 scripts/check_dogfood_harness.py
  - cargo build --locked --bin kit
  - cargo test --locked --test conformance --test integration
  - cargo test --locked --test cli_frontend --test provider_cli
  - cargo test --locked --manifest-path dogfood-harness/Cargo.toml
  - test -z "$KIT_TRIAL_AGENT_IMAGE" || cargo test --locked --test adversarial trial_grader_access::production_helper_denies_agent_grader_input_reads_and_writes -- --ignored --exact
  - test -z "$KIT_TRIAL_AGENT_IMAGE" || cargo test --locked --test adversarial trial_grader_access::production_protocol_rejects_all_canary_encodings_before_persistence -- --ignored --exact
  - test -z "$KIT_CORE_EVIDENCE_ROOT" || cargo test --locked --test adversarial trial_grader_access::production_grader_probe_rejects_every_channel_and_encoding_before_persistence -- --ignored --exact
  - test -z "$KIT_CORE_EVIDENCE_ROOT" || cargo test --locked --test adversarial trial_grader_access::production_core_harness_calibrates_and_reproduces_through_trusted_helper -- --ignored --exact
