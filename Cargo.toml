[package]
name = "kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false

[dependencies]
a2a-protocol-client = "=0.8.0"
a2a-protocol-server = { version = "=0.8.0", default-features = false }
a2a-protocol-types = "=0.8.0"
agent-client-protocol = "=1.3.0"
agentkit-acp = "=0.10.5"
agentkit-core = "=0.10.5"
agentkit-context = "=0.10.5"
agentkit-loop = "=0.10.5"
agentkit-tool-compose = { version = "=0.10.6", default-features = false, features = ["runlet"] }
agentkit-tools-core = "=0.10.5"
async-trait = "=0.1.92"
blake3 = "=1.8.6"
bytes = "=1.12.1"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-util = "=0.3.34"
httpdate = "=1.0.3"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
runlet = "=0.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["compat"] }
unicode-width = "=0.2.2"
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"
