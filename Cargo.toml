[package]
name = "kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false

[dependencies]
a2a-protocol-client = "=0.7.0"
a2a-protocol-server = { version = "=0.7.0", default-features = false }
a2a-protocol-types = "=0.7.0"
agent-client-protocol = "=1.0.1"
agentkit-acp = "=0.10.3"
agentkit-core = "=0.10.3"
agentkit-loop = "=0.10.3"
agentkit-tool-compose = { version = "=0.10.3", features = ["runlet"] }
agentkit-tools-core = "=0.10.3"
async-trait = "=0.1.91"
blake3 = "=1.8.2"
bytes = "=1.12.1"
clap = { version = "=4.6.4", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-util = "=0.3.32"
httpdate = "=1.0.3"
ratatui = "=0.30.2"
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
runlet = "=0.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.50.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["compat"] }
unicode-width = "=0.2.2"
zeroize = { version = "=1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.23.0"
