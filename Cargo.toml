[package]
name = "kit"
version = "0.1.23"
edition = "2024"
rust-version = "1.94.0"
publish = false

[dependencies]
a2a-protocol-client = "=0.8.0"
a2a-protocol-server = { version = "=0.8.0", default-features = false }
a2a-protocol-types = "=0.8.0"
agent-client-protocol = { version = "=2.0.0", features = ["unstable_session_fork"] }
agentkit-acp = "=0.10.6"
agentkit-core = "=0.10.5"
agentkit-context = "=0.10.5"
agentkit-compaction = "=0.10.5"
agentkit-loop = "=0.10.5"
agentkit-mcp = "=0.10.6"
agentkit-tool-compose = { version = "=0.10.7", default-features = false, features = ["runlet"] }
agentkit-tools-core = "=0.10.5"
async-trait = "=0.1.92"
atomicwrites = "=0.4.4"
blake3 = "=1.8.6"
bytes = "=1.12.1"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
httpdate = "=1.0.3"
hyper = "=1.11.0"
hyper-util = { version = "=0.1.20", features = ["server", "http1", "http2", "tokio"] }
jsonschema = { version = "=0.49.9", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
rmcp = { version = "=3.1.2", default-features = false, features = ["auth", "client"] }
runlet = "=0.3.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.9.12"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["compat"] }
unicode-width = "=0.2.2"
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
keyring-core = "=1.0.0"

[dev-dependencies]
tempfile = "=3.27.0"
