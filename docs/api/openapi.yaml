          type: [integer, 'null']
          minimum: 0
        max_turns:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    ConcurrencyLayer:
      type: object
      properties:
        max_runs:
          type: [integer, 'null']
          minimum: 0
        max_tools:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    ConfigRetentionLayer:
      type: object
      properties:
        event_days:
          type: [integer, 'null']
          minimum: 0
        artifact_days:
          type: [integer, 'null']
          minimum: 0
      additionalProperties: false
    ConfigLayer:
      type: object
      required: [schema_version]
      properties:
        schema_version:
          type: integer
          const: 2
        budgets:
          $ref: '#/components/schemas/BudgetLayer'
        concurrency:
          $ref: '#/components/schemas/ConcurrencyLayer'
        retention:
          $ref: '#/components/schemas/ConfigRetentionLayer'
        provider:
          type: [string, 'null']
          enum: [anthropic, open_ai, open_router, ollama, null]
        executor:
          type: [string, 'null']
          enum: [local, restricted_container, isolated_vm, null]
        grammar_edit:
          oneOf:
            - $ref: '#/components/schemas/GrammarEditExperiment'
            - type: 'null'
        grants:
          oneOf:
            - type: array
              uniqueItems: true
              items:
                type: string
                enum: [model_call, workspace_read, workspace_write, process_spawn, network_egress]
            - type: 'null'
      additionalProperties: false
    GrammarEditExperiment:
      type: object
      required: [version, enabled, unsupported_provider]
      properties:
        version:
          type: integer
