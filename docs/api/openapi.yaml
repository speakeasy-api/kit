  /v1/projects/{project_id}/repository/read:
    $ref: '#/components/pathItems/RepositoryRead'
  /v1/projects/{project_id}/repository/edit:
    $ref: '#/components/pathItems/RepositoryEdit'
  /v1/projects/{project_id}/repository/run:
    $ref: '#/components/pathItems/RepositoryRun'
  /v1/projects/{project_id}/repository/check:
    $ref: '#/components/pathItems/RepositoryCheck'
  /v1/repository-results/{result_id}:
    get:
      operationId: getRepositoryResult
      tags: [Repository]
      parameters:
        - $ref: '#/components/parameters/RepositoryResultId'
      responses:
        '200': {description: Durable repository operation result, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryResult'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/repository-results/{result_id}/events:
    get:
      operationId: getRepositoryResultEvents
      tags: [Repository]
      parameters:
        - $ref: '#/components/parameters/RepositoryResultId'
      responses:
        '200': {description: 'Durable intent, progress, and outcome events', content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryEvents'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/repository-results/{result_id}/approval:
    post:
      operationId: resolveRepositoryApproval
      tags: [Repository]
      parameters:
        - $ref: '#/components/parameters/RepositoryResultId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepositoryApprovalResolution'}
      responses:
        '202': {$ref: '#/components/responses/RepositoryOperationAccepted'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/repository-results/{result_id}/cancel:
    post:
      operationId: cancelRepositoryOperation
      tags: [Repository]
      parameters:
        - $ref: '#/components/parameters/RepositoryResultId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RepositoryCancellation'}
      responses:
        '202': {$ref: '#/components/responses/RepositoryOperationAccepted'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/repository-artifacts/{artifact_ref}:
    get:
      operationId: getRepositoryArtifact
      tags: [Repository]
      parameters:
        - name: artifact_ref
          in: path
          required: true
          schema: {type: string, pattern: '^(artifact-ref|blake3):[0-9a-f]{64}$'}
      responses:
        '200': {description: Authorized artifact bytes, content: {application/octet-stream: {schema: {type: string, contentEncoding: binary}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Transport-issued bearer credential. Remote deployments validate OIDC or mTLS before routing.
  parameters:
    RepositoryResultId:
      name: result_id
      in: path
      required: true
      schema: {type: string, pattern: '^tool_call_[0-7][0-9a-hjkmnp-tv-z]{25}$'}
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ProjectId'
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ThreadId'
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RunId'
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApprovalId'
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ArtifactId'
    DeletionJobId:
      name: deletion_job_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^deletion_[0-9a-f]{32}$'
    TerminalId:
      name: terminal_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TerminalId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Retained with the mutation receipt for durable retry and conflict detection.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[!-~]+$'
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PageCursor'
    RequiredCursor:
      name: cursor
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/PageCursor'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    StreamCursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OpaqueStreamCursor'
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/OpaqueStreamCursor'
  pathItems:
    RepositoryDiscover:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      post:
        operationId: discoverRepository
        tags: [Repository]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryDiscoverInput'}}}}
        responses:
          '202': {$ref: '#/components/responses/RepositoryOperationAccepted'}
          '400': {$ref: '#/components/responses/Problem'}
          '401': {$ref: '#/components/responses/Unauthenticated'}
          '404': {$ref: '#/components/responses/Problem'}
          '409': {$ref: '#/components/responses/Problem'}
          '503': {$ref: '#/components/responses/Problem'}
    RepositorySearch:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      post:
        operationId: searchRepository
        tags: [Repository]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RepositorySearchInput'}}}}
        responses:
          '202': {$ref: '#/components/responses/RepositoryOperationAccepted'}
          '400': {$ref: '#/components/responses/Problem'}
          '401': {$ref: '#/components/responses/Unauthenticated'}
          '404': {$ref: '#/components/responses/Problem'}
          '409': {$ref: '#/components/responses/Problem'}
          '503': {$ref: '#/components/responses/Problem'}
    RepositoryRead:
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      post:
        operationId: readRepository
        tags: [Repository]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryReadInput'}}}}
        responses:
          '202': {$ref: '#/components/responses/RepositoryOperationAccepted'}
          '400': {$ref: '#/components/responses/Problem'}
          '401': {$ref: '#/components/responses/Unauthenticated'}
          '404': {$ref: '#/components/responses/Problem'}
          '409': {$ref: '#/components/responses/Problem'}
          '503': {$ref: '#/components/responses/Problem'}
    RepositoryEdit:
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      post:
        operationId: editRepository
        tags: [Repository]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryEditInput'}}}}
        responses:
          '202': {$ref: '#/components/responses/RepositoryOperationAccepted'}
          '400': {$ref: '#/components/responses/Problem'}
          '401': {$ref: '#/components/responses/Unauthenticated'}
          '404': {$ref: '#/components/responses/Problem'}
          '409': {$ref: '#/components/responses/Problem'}
          '501': {$ref: '#/components/responses/Problem'}
          '503': {$ref: '#/components/responses/Problem'}
    RepositoryRun:
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      post:
        operationId: runRepositoryCommand
        tags: [Repository]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryRunInput'}}}}
        responses:
          '202': {$ref: '#/components/responses/RepositoryOperationAccepted'}
          '400': {$ref: '#/components/responses/Problem'}
          '401': {$ref: '#/components/responses/Unauthenticated'}
          '404': {$ref: '#/components/responses/Problem'}
          '409': {$ref: '#/components/responses/Problem'}
          '501': {$ref: '#/components/responses/Problem'}
          '503': {$ref: '#/components/responses/Problem'}
    RepositoryCheck:
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      post:
        operationId: checkRepository
        tags: [Repository]
        requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryCheckInput'}}}}
        responses:
          '202': {$ref: '#/components/responses/RepositoryOperationAccepted'}
          '400': {$ref: '#/components/responses/Problem'}
          '401': {$ref: '#/components/responses/Unauthenticated'}
          '404': {$ref: '#/components/responses/Problem'}
          '409': {$ref: '#/components/responses/Problem'}
          '501': {$ref: '#/components/responses/Problem'}
          '503': {$ref: '#/components/responses/Problem'}
    ProjectEventStream:
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/StreamCursor'
        - $ref: '#/components/parameters/LastEventId'
      get:
        operationId: streamProjectEvents
        tags: [Events]
        description: >-
          Tails authorized durable project events as SSE. The response remains open,
          emits a heartbeat at least once per second while idle, and disconnects a
          persistently backpressured client so it can resume from its last event id.
          Reconnect with Last-Event-ID or the cursor query parameter; when both are
          present they must match.
        responses:
          '200':
            description: Live SSE event frames. X-Kit-Cursor is the durable cursor at connection time.
            headers:
              X-Kit-Cursor:
                required: true
                schema:
                  $ref: '#/components/schemas/OpaqueStreamCursor'
            content:
              text/event-stream:
                schema:
                  type: string
          '400':
            $ref: '#/components/responses/Problem'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '404':
            $ref: '#/components/responses/Problem'
          '410':
            $ref: '#/components/responses/Problem'
          '500':
            $ref: '#/components/responses/Problem'
          '503':
            $ref: '#/components/responses/Problem'
          '504':
            $ref: '#/components/responses/Problem'
    TerminalAttach:
      parameters:
        - $ref: '#/components/parameters/TerminalId'
        - $ref: '#/components/parameters/RequestId'
      get:
        operationId: attachTerminal
        tags: [Terminals]
        description: >-
          Reserved authenticated WebSocket attachment surface. Until the terminal
          owner service is integrated this returns terminal_unavailable after
          authorization and never returns a WebSocket upgrade.
        responses:
          '400':
            $ref: '#/components/responses/Problem'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '404':
            $ref: '#/components/responses/Problem'
          '500':
            $ref: '#/components/responses/Problem'
          '503':
            $ref: '#/components/responses/Problem'
          '504':
            $ref: '#/components/responses/Problem'
  responses:
    RepositoryOperationAccepted:
      description: Repository operation persisted before dispatch.
      headers:
        Location:
          required: true
          schema: {type: string, pattern: '^/v1/repository-results/tool_call_'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RepositoryResult'}
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthenticated:
      description: Authentication failed before resource dispatch.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ResourceCreated:
      description: Resource created synchronously.
      headers:
        Location:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceReceipt'
    ResourceAccepted:
      description: Existing domain resource accepted for asynchronous work.
      headers:
        Location:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceReceipt'
    ResourceUpdated:
      description: Existing resource updated synchronously.
      headers:
        Location:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceReceipt'
  schemas:
    RepositoryStatus:
      type: object
      required: [schema_version, principal_id, project_id]
      properties:
        schema_version: {const: 1}
        principal_id: {type: string}
        project_id: {$ref: '#/components/schemas/ProjectId'}
        available: {type: boolean}
        unavailable_reason: {type: [string, 'null']}
      additionalProperties: false
    RepositoryRevision:
      type: object
      required: [schema_version, revision, digest]
      properties:
        schema_version: {const: 1}
        revision: {type: string, pattern: '^r:[0-9a-f]{64}$'}
        digest: {type: string, pattern: '^blake3:[0-9a-f]{64}$'}
      additionalProperties: true
    RepositoryCapabilities:
      type: object
      required: [schema_version, items]
      properties:
        schema_version: {const: 1}
        items:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [name, provider_name, version, effect, input_schema, configured, available, unavailable_reasons, availability]
            properties:
              name: {enum: [discover, search, read, edit, run, check]}
              provider_name: {type: string}
              version: {type: string}
              effect: {enum: [workspace_read, workspace_write, process_spawn]}
              input_schema: {type: object}
              configured: {type: boolean}
              available: {type: boolean}
              unavailable_code: {type: [string, 'null']}
              unavailable_reasons: {type: array, items: {type: string}}
              availability:
                type: object
                required: [checked_at_unix_micros, expires_at_unix_micros, generation, image]
                properties:
                  checked_at_unix_micros: {type: integer}
                  expires_at_unix_micros: {type: integer}
                  generation: {type: string, pattern: '^[0-9a-f]{64}$'}
                  image:
                    type: [object, 'null']
                    properties:
                      reference: {type: [string, 'null']}
                      resolved_digest: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
                      immutable: {type: boolean}
                    required: [reference, resolved_digest, immutable]
                    additionalProperties: false
                additionalProperties: false
            additionalProperties: false
      additionalProperties: false
    RepositoryResult:
      type: object
      required: [schema_version, id, operation, status, replayed, output, error, cost, artifacts]
      properties:
        schema_version: {const: 1}
        id: {$ref: '#/components/schemas/RepositoryResultId'}
        native_operation_id: {$ref: '#/components/schemas/RepositoryResultId'}
        native_result_id: {$ref: '#/components/schemas/RepositoryResultId'}
        operation: {type: string, pattern: '^repo\\.(discover|search|read|edit|run|check)$'}
        status: {enum: [queued, running, waiting_approval, completed, failed, cancelled, outcome_unknown, denied]}
        replayed: {type: boolean}
        approval: {$ref: '#/components/schemas/RepositoryApproval'}
        owner: {$ref: '#/components/schemas/RepositoryOperationOwner'}
        cancellation_requested: {type: boolean}
        output: {type: [object, 'null']}
        error: {oneOf: [{$ref: '#/components/schemas/RepositoryOperationError'}, {type: 'null'}]}
        cost: {oneOf: [{$ref: '#/components/schemas/RepositoryCost'}, {type: 'null'}]}
        artifacts: {oneOf: [{$ref: '#/components/schemas/RepositoryArtifacts'}, {type: 'null'}]}
        created_at_unix_micros: {type: integer}
        updated_at_unix_micros: {type: integer}
      additionalProperties: false
    RepositoryResultId:
      type: string
      pattern: '^tool_call_[0-7][0-9a-hjkmnp-tv-z]{25}$'
    RepositoryEvents:
      type: object
      required: [schema_version, result_id, items]
      properties:
        schema_version: {const: 1}
        result_id: {$ref: '#/components/schemas/RepositoryResultId'}
        items: {type: array, items: {$ref: '#/components/schemas/RepositoryEvent'}}
      additionalProperties: false
    RepositoryEvent:
      type: object
      required: [cursor, sequence, type, payload, created_at_unix_micros]
      properties:
        cursor: {type: string}
        sequence: {type: integer, minimum: 1}
        type: {type: string}
        payload: {type: object}
        created_at_unix_micros: {type: integer}
      additionalProperties: false
    RepositoryApprovalResolution:
      type: object
      required: [decision]
      properties: {decision: {enum: [approved, denied]}}
      additionalProperties: false
    RepositoryCancellation:
      type: object
      properties: {}
      additionalProperties: false
    RepositoryOperationError:
      type: object
      required: [code, effect_state, retryable]
      properties:
        code: {type: string, pattern: '^[a-z0-9_]+$'}
        effect_state: {enum: [none, attempted, unknown]}
        retryable: {type: boolean}
      additionalProperties: false
    RepositoryApproval:
      type: object
      required: [state]
      properties:
        id: {type: [string, 'null']}
        state: {enum: [not_required, pending, approved, denied]}
      additionalProperties: false
    RepositoryOperationOwner:
      type: object
      required: [run_id, attempt_id, fence]
      properties:
        run_id: {type: string}
        attempt_id: {type: string}
        fence: {type: integer, minimum: 1}
      additionalProperties: false
    RepositoryArtifact:
      type: object
      required: [reference, digest, media_type, size, provenance]
      properties:
        reference: {type: string, pattern: '^(artifact-ref|blake3):[0-9a-f]{64}$'}
        digest: {type: string, pattern: '^blake3:[0-9a-f]{64}$'}
        media_type: {type: string}
        size: {type: integer, minimum: 0}
        provenance:
          type: object
          required: [kind, operation_id, native_result_id, principal_id, project_id]
          properties:
            kind: {type: string}
            operation_id: {$ref: '#/components/schemas/RepositoryResultId'}
            native_result_id: {$ref: '#/components/schemas/RepositoryResultId'}
            principal_id: {type: string}
            project_id: {$ref: '#/components/schemas/ProjectId'}
          additionalProperties: false
      additionalProperties: false
    RepositoryArtifacts:
      type: object
      required: [repository_result, actual_diff, verification_receipt, verification_logs, feedback_payload, feedback_report, edit_events, cost]
      properties:
        repository_result: {$ref: '#/components/schemas/RepositoryArtifact'}
        actual_diff: {oneOf: [{$ref: '#/components/schemas/RepositoryArtifact'}, {type: 'null'}]}
        verification_receipt: {oneOf: [{$ref: '#/components/schemas/RepositoryArtifact'}, {type: 'null'}]}
        verification_logs: {oneOf: [{$ref: '#/components/schemas/RepositoryArtifact'}, {type: 'null'}]}
        feedback_payload: {oneOf: [{$ref: '#/components/schemas/RepositoryArtifact'}, {type: 'null'}]}
        feedback_report: {oneOf: [{$ref: '#/components/schemas/RepositoryArtifact'}, {type: 'null'}]}
        edit_events: {$ref: '#/components/schemas/RepositoryArtifact'}
        cost: {$ref: '#/components/schemas/RepositoryArtifact'}
      additionalProperties: false
    RepositoryCost:
      type: object
      required: [schema_version, operation_id, native_result_id, provider, reservations, debited, reserved, released, charged]
      properties:
        schema_version: {const: 1}
        operation_id: {$ref: '#/components/schemas/RepositoryResultId'}
        native_result_id: {$ref: '#/components/schemas/RepositoryResultId'}
        provider: {type: object, required: [calls, cost_microusd, reason], properties: {calls: {type: integer}, cost_microusd: {type: integer}, reason: {type: string}}, additionalProperties: false}
        reservations: {type: array, items: {$ref: '#/components/schemas/RepositorySpend'}}
        debited: {$ref: '#/components/schemas/RepositorySpend'}
        reserved: {$ref: '#/components/schemas/RepositorySpend'}
        released: {$ref: '#/components/schemas/RepositorySpend'}
        charged: {type: boolean}
      additionalProperties: false
    RepositorySpend:
      type: object
      required: [cost_microusd, tokens, turns, tools, processes]
      properties:
        kind: {type: string}
        cost_microusd: {type: integer, minimum: 0}
        tokens: {type: integer, minimum: 0}
        turns: {type: integer, minimum: 0}
        tools: {type: integer, minimum: 0}
        processes: {type: integer, minimum: 0}
      additionalProperties: false
    RepositoryRevisionId: {type: string, pattern: '^r:[0-9a-f]{64}$'}
    RepositoryRelativePath: {type: string, minLength: 1, maxLength: 4096}
    RepositoryDiscoverInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required: [expected_revision, terms, roots, languages]
      properties:
        expected_revision: {$ref: '#/components/schemas/RepositoryRevisionId'}
        terms: {type: array, maxItems: 32, items: {type: string, minLength: 1, maxLength: 256}}
        roots: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/RepositoryRelativePath'}}
        languages: {type: array, maxItems: 32, items: {type: string}}
        cursor: {type: [object, 'null']}
      additionalProperties: false
    RepositorySearchInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required: [expected_revision, text, mode, path_prefixes, languages]
      properties:
        expected_revision: {$ref: '#/components/schemas/RepositoryRevisionId'}
        text: {type: string, minLength: 1, maxLength: 4096}
        mode: {enum: [path, content, path_and_content]}
        path_prefixes: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/RepositoryRelativePath'}}
        languages: {type: array, maxItems: 32, items: {type: string}}
        cursor: {type: [object, 'null']}
      additionalProperties: false
    RepositoryReadInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required: [expected_revision, path, range]
      properties:
        expected_revision: {$ref: '#/components/schemas/RepositoryRevisionId'}
        path: {$ref: '#/components/schemas/RepositoryRelativePath'}
        range:
          oneOf:
            - {type: object, required: [kind], properties: {kind: {const: full}}, additionalProperties: false}
            - {type: object, required: [kind, start, end], properties: {kind: {const: bytes}, start: {type: integer, minimum: 0}, end: {type: integer, minimum: 1}}, additionalProperties: false}
            - {type: object, required: [kind, start, end], properties: {kind: {const: lines}, start: {type: integer, minimum: 1}, end: {type: integer, minimum: 1}}, additionalProperties: false}
      additionalProperties: false
    RepositoryEditInput:
      $id: kit.native.edit.input.v1
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required: [version, expected_revision, operations]
      properties:
        version: {const: 1}
        expected_revision: {$ref: '#/components/schemas/RepositoryRevisionId'}
        operations:
          type: array
          maxItems: 1000
          items:
            oneOf:
              - type: object
                required: [op, path, content, executable]
                properties: {op: {const: add_file}, path: {type: string, minLength: 1}, content: {$ref: '#/components/schemas/RepositoryTextContent'}, executable: {type: boolean}}
                additionalProperties: false
              - type: object
                required: [op, path, base_digest]
                properties: {op: {const: delete_file}, path: {type: string, minLength: 1}, base_digest: {$ref: '#/components/schemas/RepositoryContentDigest'}}
                additionalProperties: false
              - type: object
                required: [op, from, to, base_digest]
                properties: {op: {const: move_file}, from: {type: string, minLength: 1}, to: {type: string, minLength: 1}, base_digest: {$ref: '#/components/schemas/RepositoryContentDigest'}}
                additionalProperties: false
              - type: object
                required: [op, path, base_digest, range, expected, replacement, executable]
                properties:
                  op: {const: replace_range}
                  path: {type: string, minLength: 1}
                  base_digest: {$ref: '#/components/schemas/RepositoryContentDigest'}
                  range: {type: object, required: [start, end], properties: {start: {type: integer, minimum: 0}, end: {type: integer, minimum: 0}}, additionalProperties: false}
                  expected: {$ref: '#/components/schemas/RepositoryTextContent'}
                  replacement: {$ref: '#/components/schemas/RepositoryTextContent'}
                  executable: {enum: [preserve, executable, non_executable]}
                additionalProperties: false
      additionalProperties: false
    RepositoryTextContent:
      type: object
      required: [encoding, newline, text, final_newline]
      properties:
        encoding: {const: utf8}
        newline: {enum: [lf, crlf]}
        text: {type: string}
        final_newline: {type: boolean}
      additionalProperties: false
    RepositoryContentDigest: {type: string, pattern: '^(blake3|sha256):[0-9a-f]{64}$'}
    RepositoryRunInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required: [argv, working_directory, mounts, environment, network, limits, host_compatibility, background]
      properties:
        argv: {type: array, minItems: 1, maxItems: 256, items: {type: string, minLength: 1, maxLength: 16384}}
        working_directory: {const: '.'}
        mounts: {const: {source: read_only, build: read_write, temp: read_write}}
        environment: {type: object, maxProperties: 128, additionalProperties: {type: string, maxLength: 16384}}
        network: {enum: [deny, profile_grants]}
        limits: {$ref: '#/components/schemas/RepositoryProcessLimits'}
        host_compatibility: {type: boolean}
        background: {const: foreground}
      additionalProperties: false
    RepositoryProcessLimits:
      type: object
      required: [cpu_millis, memory_bytes, pids, file_bytes, disk_bytes, io_bytes, output_bytes, wall_time_millis]
      properties:
        cpu_millis: {type: integer, minimum: 1}
        memory_bytes: {type: integer, minimum: 1}
        pids: {type: integer, minimum: 1}
        file_bytes: {type: integer, minimum: 1}
        disk_bytes: {type: integer, minimum: 1}
        io_bytes: {type: integer, minimum: 1}
        output_bytes: {type: integer, minimum: 1, maximum: 1048576}
        wall_time_millis: {type: integer, minimum: 1}
      additionalProperties: false
    RepositoryCheckInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required: [profile, targets]
      properties:
        profile: {enum: [syntax, fast, targeted, full]}
        targets: {type: array, maxItems: 64, items: {type: string, minLength: 1, maxLength: 128}}
      additionalProperties: false
    ProcessId:
      $ref: './openapi.exec.yaml#/components/schemas/ProcessId'
    AttachmentId:
      $ref: './openapi.exec.yaml#/components/schemas/AttachmentId'
    ProcessState:
      $ref: './openapi.exec.yaml#/components/schemas/ProcessState'
    Process:
      $ref: './openapi.exec.yaml#/components/schemas/Process'
    ProcessList:
      $ref: './openapi.exec.yaml#/components/schemas/ProcessList'
    Terminal:
      $ref: './openapi.exec.yaml#/components/schemas/Terminal'
    Attachment:
      $ref: './openapi.exec.yaml#/components/schemas/Attachment'
    MutationReceipt:
      $ref: './openapi.exec.yaml#/components/schemas/MutationReceipt'
    AllocateTerminal:
      $ref: './openapi.exec.yaml#/components/schemas/AllocateTerminal'
    WriterLease:
      $ref: './openapi.exec.yaml#/components/schemas/WriterLease'
    TerminalInput:
      $ref: './openapi.exec.yaml#/components/schemas/TerminalInput'
    TerminalResize:
      $ref: './openapi.exec.yaml#/components/schemas/TerminalResize'
    OutputPage:
      $ref: './openapi.exec.yaml#/components/schemas/OutputPage'
    ResizePage:
      $ref: './openapi.exec.yaml#/components/schemas/ResizePage'
    ExecutorEventPage:
      $ref: './openapi.exec.yaml#/components/schemas/ExecutorEventPage'
    OpaqueId:
      type: string
      minLength: 28
      maxLength: 37
      description: Opaque, case-sensitive identifier. Clients must not parse its prefix or payload.
    ProjectId:
      allOf:
        - $ref: '#/components/schemas/OpaqueId'
        - pattern: '^project_[0-7][0-9a-hjkmnp-tv-z]{25}$'
    ThreadId:
      allOf:
        - $ref: '#/components/schemas/OpaqueId'
        - pattern: '^thread_[0-7][0-9a-hjkmnp-tv-z]{25}$'
    RunId:
      allOf:
        - $ref: '#/components/schemas/OpaqueId'
        - pattern: '^run_[0-7][0-9a-hjkmnp-tv-z]{25}$'
    ApprovalId:
      allOf:
        - $ref: '#/components/schemas/OpaqueId'
        - pattern: '^approval_[0-7][0-9a-hjkmnp-tv-z]{25}$'
    ArtifactId:
      allOf:
        - $ref: '#/components/schemas/OpaqueId'
        - pattern: '^artifact_[0-7][0-9a-hjkmnp-tv-z]{25}$'
    TerminalId:
      allOf:
        - $ref: '#/components/schemas/OpaqueId'
        - pattern: '^terminal_[0-7][0-9a-hjkmnp-tv-z]{25}$'
    PrincipalId:
      allOf:
        - $ref: '#/components/schemas/OpaqueId'
        - pattern: '^principal_[0-7][0-9a-hjkmnp-tv-z]{25}$'
    ArtifactRef:
      type: string
      pattern: '^blake3:[0-9a-f]{64}$'
      description: Content-addressed artifact reference.
    PageCursor:
      type: string
      pattern: '^cursor_[0-9a-f]{16}$'
      description: Opaque pagination and cursor-status value. It is not an SSE resume cursor.
    OpaqueStreamCursor:
      type: string
      pattern: '^kitc1_[0-9a-f]{48}$'
      description: Principal-, project-, filter-, and schema-bound durable SSE cursor.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC timestamp.
      examples: ['2026-07-22T12:34:56.123456Z']
    CreateProject:
      type: object
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/ProjectId'
