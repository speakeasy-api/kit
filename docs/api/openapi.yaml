openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Kit HTTP API
  version: 1.0.0
  description: >-
    Authenticated M001 command/query API. Clients must ignore unknown response
    fields. Identifiers and cursors are opaque and must not be parsed. Executor
    mutation outcomes are retained for the declared retry window. Executor cursor
    recovery snapshots contain authorized processes, terminals, and current
    attachments, including replacement history viewers on exited or interrupted
    terminals; detached, stale, and restart-invalidated attachments are omitted.
    Native PTY primitives do not imply that a production attempt-owned executor
    profile can expose a PTY.
x-kit-executor-idempotency:
  retry-window-millis: 86400000
  maximum-records: 4096
  capacity-policy: reject-new
x-kit-executor-cursor-recovery:
  attachment-policy: current-authorized-history-viewers
  invalidated-attachment-policy: excluded
x-kit-executor-pty:
  native-primitive:
    linux: available
    macos: available
    windows: platform_unavailable
  production-attempt-owned-profile:
    linux: profile_unavailable
    macos: profile_unavailable
    windows: platform_unavailable
  unavailable-problem-codes: [platform_unavailable, profile_unavailable]
  external-register:
    linux: EXT-22
    windows: EXT-19
  windows-external-blockers: [ConPTY, Job Objects, Windows container/Hyper-V boundary]
  windows-parity: false
x-kit-provider-correction:
  status: blocked
  dependency: M004
  reason: No provider correction mutation has an exact real capability and public API path.
servers:
  - url: http://localhost
security:
  - bearerAuth: []
tags:
  - name: Projects
  - name: Threads
  - name: Runs
  - name: Events
  - name: Approvals
  - name: Auth
  - name: Artifacts
  - name: Retention
  - name: Terminals
  - name: Processes
  - name: ExecutorEvents
  - name: Repository
