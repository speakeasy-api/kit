          minimum: 0
      additionalProperties: true
    ProjectRetention:
      type: object
      anyOf:
        - required: [retention]
        - required: [effective]
      properties:
        retention:
          oneOf:
            - $ref: '#/components/schemas/RetentionPolicy'
            - type: 'null'
        effective:
          $ref: '#/components/schemas/RetentionPolicy'
      additionalProperties: true
    Capability:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
      additionalProperties: true
    CapabilityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
      additionalProperties: true
    CommandReceipt:
      type: object
      required: [operation, commit_positions, replayed]
      properties:
        operation:
          type: string
        commit_positions:
          type: array
          items:
            type: integer
            minimum: 1
        replayed:
          type: boolean
      additionalProperties: true
    ResourceReceipt:
      type: object
      required: [resource, receipt]
      properties:
        resource:
          type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/OpaqueId'
          additionalProperties: true
        receipt:
          $ref: '#/components/schemas/CommandReceipt'
      additionalProperties: true
    Event:
      type: object
      required: [cursor, project_id, operation, stream, payload]
      properties:
        cursor:
          $ref: '#/components/schemas/PageCursor'
        project_id:
          $ref: '#/components/schemas/ProjectId'
        operation:
          type: string
        stream:
          $ref: '#/components/schemas/OpaqueId'
        payload:
          type: object
          additionalProperties: true
      additionalProperties: true
    EventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          $ref: '#/components/schemas/PageCursor'
      additionalProperties: true
    EventStreamFrame:
      type: object
      required: [cursor, project_id, operation, stream, payload]
      properties:
        cursor:
          $ref: '#/components/schemas/OpaqueStreamCursor'
        project_id:
          $ref: '#/components/schemas/ProjectId'
        operation:
          type: string
        stream:
          $ref: '#/components/schemas/OpaqueId'
        payload:
          type: object
          additionalProperties: true
        schema_version:
          type: integer
          minimum: 1
      additionalProperties: true
    CursorStatus:
      type: object
      required: [requested, committed, caught_up]
      properties:
        requested:
          $ref: '#/components/schemas/PageCursor'
        committed:
          $ref: '#/components/schemas/PageCursor'
        caught_up:
          type: boolean
      additionalProperties: true
    ProjectStatus:
      type: object
      required: [committed, ready]
      properties:
        committed:
          $ref: '#/components/schemas/PageCursor'
        ready:
          type: boolean
      additionalProperties: true
    InvalidParameter:
      type: object
      required: [name, reason]
      properties:
        name:
          type: string
        reason:
          type: string
      additionalProperties: false
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details with stable Kit extensions.
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri
          pattern: '^https://kit\.dev/problems/[a-z_]+$'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          minLength: 1
        code:
          type: string
          pattern: '^[a-z_]+$'
        invalid_parameters:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParameter'
      additionalProperties: true
