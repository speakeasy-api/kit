  /v1/projects/{project_id}/repository/revision:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getRepositoryRevision
      tags: [Repository]
      responses:
        '200': {description: Current managed-workspace revision, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryRevision'}}}}
        '400': {$ref: '#/components/responses/Problem'}
