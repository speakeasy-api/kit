        '503': {$ref: '#/components/responses/Problem'}
  /v1/repository/status:
    get:
      operationId: getRepositoryStatus
      tags: [Repository]
      responses:
        '200': {description: Authenticated repository project identity, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryStatus'}}}}
