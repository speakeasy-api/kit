[package]
description = "Lua tool composition for agentkit."
homepage.workspace = true
name = "agentkit-tool-compose"
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentkit-core = { version = "0.10.2", path = "../agentkit-core" }
agentkit-tools-core = { version = "0.10.2", path = "../agentkit-tools-core" }
async-trait.workspace = true
mlua.workspace = true
runlet = { path = "../../../runlet", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_toon2 = { version = "0.2.0", optional = true }
tokio = { workspace = true, features = ["sync"] }

[features]
# Runlet execution backend (https://crates.io/crates/runlet); off by default.
runlet = ["dep:runlet", "tokio/rt"]
# TOON encoding for compose results (ResultEncoding::Toon); off by default.
toon = ["dep:serde_toon2"]

[dev-dependencies]
agentkit-tools-core = { path = "../agentkit-tools-core", features = ["schemars"] }
agentkit-tools-derive = { path = "../agentkit-tools-derive" }
schemars = { workspace = true, features = ["derive"] }
