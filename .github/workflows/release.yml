name: release

on:
  push:
    tags:
      - "v*"
      - "!v*-pre*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  linux-x64:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: x86_64-unknown-linux-gnu
      - name: Build and package
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          mkdir -p stage dist
          cp target/x86_64-unknown-linux-gnu/release/kit stage/kit
          stage/kit --version
          tar -C stage -czf "dist/kit-v${version}-x86_64-unknown-linux-gnu.tar.gz" kit
      - uses: actions/upload-artifact@v4
        with:
          name: kit-linux-x64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: linux-x64
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.KIT_RELEASES_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kit-*
          path: dist
          merge-multiple: true
      - name: Complete and publish draft release
        shell: bash
        run: |
          test -n "$GH_TOKEN" || { echo "missing repository secret: KIT_RELEASES_TOKEN" >&2; exit 1; }
          version=${GITHUB_REF_NAME#v}
          macos="kit-v${version}-aarch64-apple-darwin.tar.gz"
          draft=$(gh release view "$GITHUB_REF_NAME" \
            --repo danielkov/kit-releases --json isDraft --jq .isDraft)
          test "$draft" = true || { echo "release must exist as a draft" >&2; exit 1; }
          gh release download "$GITHUB_REF_NAME" \
            --repo danielkov/kit-releases --pattern "$macos" --dir dist
          cd dist
          test -f "$macos"
          test -f "kit-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum kit-*.tar.gz > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" kit-*.tar.gz SHA256SUMS \
            --clobber --repo danielkov/kit-releases
          gh release edit "$GITHUB_REF_NAME" \
            --repo danielkov/kit-releases --draft=false --latest
