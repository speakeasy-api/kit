name: release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_NOTES_MODEL: openai/gpt-5.6-terra

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Prepare release candidate
        id: release
        shell: bash
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Releases must run from main, not $GITHUB_REF."
            exit 1
          fi

          published_tags=()
          while IFS= read -r published_tag; do
            published_tags+=("$published_tag")
          done < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft \
              --jq '.[] | select(.isDraft | not) | .tagName'
          )
          if [[ ${#published_tags[@]} -eq 0 ]]; then
            echo "::error::Could not find a previous published release."
            exit 1
          fi

          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ ! $cargo_version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Cargo.toml contains invalid release version $cargo_version."
            exit 1
          fi

          current_tag="v$cargo_version"
          latest_published=${published_tags[0]}
          current_tag_sha=$(git rev-parse -q --verify "$current_tag^{commit}" 2>/dev/null || true)
          workflow_sha=$(git rev-parse HEAD)
          resume=false

          if [[ $latest_published == "$current_tag" && $current_tag_sha != "$workflow_sha" ]]; then
            previous_tag=$current_tag
            source_sha=$workflow_sha
          elif [[ -n $current_tag_sha && $current_tag_sha == "$workflow_sha" ]]; then
            resume=true
            release_sha=$current_tag_sha
            source_sha=$(git rev-parse "$release_sha^")
            if [[ $latest_published == "$current_tag" ]]; then
              if [[ ${#published_tags[@]} -lt 2 ]]; then
                echo "::error::Could not find the release before $current_tag."
                exit 1
              fi
              previous_tag=${published_tags[1]}
            else
              previous_tag=$latest_published
            fi
          elif [[ -n $current_tag_sha && $latest_published != "$current_tag" ]] &&
               git merge-base --is-ancestor "$current_tag_sha" "$workflow_sha"; then
            resume=true
            release_sha=$current_tag_sha
            source_sha=$(git rev-parse "$release_sha^")
            previous_tag=$latest_published
          else
            echo "::error::Cargo.toml version $cargo_version does not match latest release $latest_published."
            exit 1
          fi

          if [[ $resume == true ]]; then
            subject=$(git show -s --format=%s "$release_sha")
            if [[ $subject != "chore(release): $current_tag" ]]; then
              echo "::error::$current_tag does not point to a Kit release commit."
              exit 1
            fi
            expected=$(scripts/next-release-version.sh \
              "${previous_tag#v}" "$previous_tag" "$source_sha")
            if [[ $expected != "$cargo_version" ]]; then
              echo "::error::Release commit version $cargo_version should be $expected."
              exit 1
            fi
            version=$cargo_version
            tag=$current_tag
          else
            if ! git merge-base --is-ancestor "$previous_tag" "$source_sha"; then
              echo "::error::Previous release $previous_tag is not an ancestor of $source_sha."
              exit 1
            fi
            version=$(scripts/next-release-version.sh \
              "$cargo_version" "$previous_tag" "$source_sha")
            tag="v$version"
            if git rev-parse -q --verify "$tag^{commit}" >/dev/null; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi

            CURRENT_VERSION=$cargo_version NEXT_VERSION=$version python3 <<'PY'
          import os
          import re
          from pathlib import Path

          current = re.escape(os.environ["CURRENT_VERSION"])
          replacement = os.environ["NEXT_VERSION"]

          def update(path, pattern):
              source = Path(path).read_text()
              changed, count = re.subn(pattern, lambda match: match.group(1) + replacement + match.group(2), source)
              if count != 1:
                  raise SystemExit(f"expected one version entry in {path}, found {count}")
              Path(path).write_text(changed)

          update("Cargo.toml", rf'(?ms)(^\[package\].*?^version = "){current}(")')
          update("Cargo.lock", rf'(?m)(^\[\[package\]\]\nname = "kit"\nversion = "){current}(")')
          PY
            cargo metadata --locked --no-deps --format-version 1 >/dev/null
            git diff --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): $tag"
            release_sha=$(git rev-parse HEAD)
          fi

          git branch -f release-candidate "$release_sha"
          git bundle create "$RUNNER_TEMP/release-candidate.bundle" \
            release-candidate "^$source_sha"
          git bundle verify "$RUNNER_TEMP/release-candidate.bundle"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
      - run: mise run lint
      - run: mise run test
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate.bundle
          if-no-files-found: error
          retention-days: 1

  linux-x64:
    needs: verify
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        with:
          release-sha: ${{ needs.verify.outputs.release_sha }}
      - uses: jdx/mise-action@v4
      - name: Build and package
        shell: bash
        run: |
          version=$RELEASE_VERSION
          mise run build:release -- --target x86_64-unknown-linux-gnu
          mkdir -p stage dist
          cp target/x86_64-unknown-linux-gnu/release/kit stage/kit
          cp LICENSE THIRD_PARTY_NOTICES.md stage/
          mkdir -p stage/third_party
          cp -R third_party/licenses stage/third_party/licenses
          stage/kit --version
          tar -C stage -czf "dist/kit-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            kit LICENSE THIRD_PARTY_NOTICES.md third_party/licenses
      - uses: actions/upload-artifact@v4
        with:
          name: kit-linux-x64
          path: dist/*
          if-no-files-found: error

  macos-cli-arm64:
    needs: verify
    runs-on: blacksmith-6vcpu-macos-15
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        with:
          release-sha: ${{ needs.verify.outputs.release_sha }}
      - uses: jdx/mise-action@v4
      - name: Check optional signing credentials
        id: signing
        shell: bash
        run: |
          credentials=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGNING_IDENTITY
            APPLE_API_KEY_P8_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
          )
          configured=0
          for name in "${credentials[@]}"; do
            if [[ -n ${!name:-} ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ $configured -eq 0 ]]; then
            echo "Apple credentials are not configured; building an unsigned macOS release."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ $configured -eq ${#credentials[@]} ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apple signing credentials are only partially configured." >&2
            exit 1
          fi
      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          keychain=$RUNNER_TEMP/kit-signing.keychain-db
          certificate=$RUNNER_TEMP/kit-signing.p12
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Build, sign, notarize, and package CLI
        shell: bash
        env:
          SIGN_RELEASE: ${{ steps.signing.outputs.enabled }}
        run: |
          version=${{ needs.verify.outputs.version }}
          mise run build:release -- --target aarch64-apple-darwin
          mkdir -p stage dist
          cp target/aarch64-apple-darwin/release/kit stage/kit
          cp LICENSE THIRD_PARTY_NOTICES.md stage/
          mkdir -p stage/third_party
          cp -R third_party/licenses stage/third_party/licenses
          if [[ $SIGN_RELEASE == true ]]; then
            codesign --force --options runtime --timestamp \
              --identifier com.speakeasy.kit \
              --sign "$MACOS_SIGNING_IDENTITY" stage/kit
            codesign --verify --strict --verbose=2 stage/kit
            ditto -c -k --keepParent stage/kit "$RUNNER_TEMP/kit-notarization.zip"
            api_key=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8
            trap 'rm -f "$api_key"' EXIT
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key"
            chmod 600 "$api_key"
            notary_log=$RUNNER_TEMP/kit-notarization.log
            xcrun notarytool submit "$RUNNER_TEMP/kit-notarization.zip" \
              --key "$api_key" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait 2>&1 | tee "$notary_log"
            grep -Eq '(^|[[:space:]])status: Accepted([[:space:]]|$)' "$notary_log" || {
              echo "Apple did not accept the standalone Kit notarization." >&2
              exit 1
            }
          fi
          stage/kit --version
          tar -C stage -czf "dist/kit-v${version}-aarch64-apple-darwin.tar.gz" \
            kit LICENSE THIRD_PARTY_NOTICES.md third_party/licenses
      - uses: actions/upload-artifact@v4
        with:
          name: kit-macos-cli-arm64
          path: dist/kit-*.tar.gz
          if-no-files-found: error

  macos-app-arm64:
    needs: [verify, macos-cli-arm64]
    runs-on: blacksmith-6vcpu-macos-15
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        with:
          release-sha: ${{ needs.verify.outputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: kit-macos-cli-arm64
          path: ${{ runner.temp }}/macos-cli
      - name: Install shared release helper
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          tar -xzf "$RUNNER_TEMP/macos-cli/kit-v${RELEASE_VERSION}-aarch64-apple-darwin.tar.gz" \
            -C target/aarch64-apple-darwin/release kit
          test -x target/aarch64-apple-darwin/release/kit
      - name: Check optional signing credentials
        id: signing
        shell: bash
        run: |
          credentials=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGNING_IDENTITY
            APPLE_API_KEY_P8_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
          )
          configured=0
          for name in "${credentials[@]}"; do
            if [[ -n ${!name:-} ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ $configured -eq 0 ]]; then
            echo "Apple credentials are not configured; building an unsigned macOS release."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ $configured -eq ${#credentials[@]} ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apple signing credentials are only partially configured." >&2
            exit 1
          fi
      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          keychain=$RUNNER_TEMP/kit-signing.keychain-db
          certificate=$RUNNER_TEMP/kit-signing.p12
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$MACOS_CERTIFICATE_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - uses: jdx/mise-action@v4
      - name: Archive, sign, notarize, and package app
        shell: bash
        env:
          SIGN_RELEASE: ${{ steps.signing.outputs.enabled }}
          KIT_ARCHIVE_PATH: ${{ runner.temp }}/Kit.xcarchive
        run: |
          mise run macos:archive
          mise run macos:package -- \
            "$KIT_ARCHIVE_PATH/Products/Applications/Kit.app" dist "${{ needs.verify.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: kit-macos-app-arm64
          path: dist/Kit-*
          if-no-files-found: error

  release-notes:
    needs: [verify, linux-x64, macos-cli-arm64, macos-app-arm64, container-build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        with:
          release-sha: ${{ needs.verify.outputs.release_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: kit-linux-x64
          path: dist
      - name: Generate release notes with the built Kit CLI
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          mkdir -p release-kit
          tar -xzf "dist/kit-v${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -C release-kit
          release-kit/kit --version
          release-kit/kit prompt \
            --root "$GITHUB_WORKSPACE" \
            --provider openrouter \
            --model "$RELEASE_NOTES_MODEL" \
            "use release-notes skill for ${{ needs.verify.outputs.previous_tag }}..${{ needs.verify.outputs.release_sha }}; respond only with release notes" \
            > kit-output.txt
          sed '$ { /^session_id: /d; }' kit-output.txt > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Kit returned an empty release note."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    needs: [verify, linux-x64, macos-cli-arm64, macos-app-arm64, release-notes]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: ./.github/actions/checkout-release-candidate
        with:
          release-sha: ${{ needs.verify.outputs.release_sha }}
      - name: Advance main and create release tag
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        shell: bash
        run: |
          remote_main=$(
            git ls-remote --heads origin refs/heads/main | cut -f1
          )
          remote_tag=$(
            git ls-remote --tags --refs origin "refs/tags/$RELEASE_TAG" | cut -f1
          )

          if [[ $remote_main == "$SOURCE_SHA" && -z $remote_tag ]]; then
            git push --atomic \
              --force-with-lease="refs/heads/main:$SOURCE_SHA" \
              --force-with-lease="refs/tags/$RELEASE_TAG:" \
              origin \
              "$RELEASE_SHA:refs/heads/main" \
              "$RELEASE_SHA:refs/tags/$RELEASE_TAG"
          elif [[ $remote_tag == "$RELEASE_SHA" ]]; then
            git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/release-main"
            if ! git merge-base --is-ancestor \
              "$RELEASE_SHA" refs/remotes/origin/release-main; then
              echo "::error::Tag $RELEASE_TAG is not contained in main."
              exit 1
            fi
            echo "Release refs already exist; resuming publication."
          else
            echo "::error::main or $RELEASE_TAG changed while the release was building."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: kit-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd dist
          sha256sum kit-*.tar.gz Kit-*.zip > SHA256SUMS
          prerelease=${{ needs.verify.outputs.prerelease }}
          title="Kit $RELEASE_VERSION"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" kit-*.tar.gz Kit-*.zip SHA256SUMS \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            create_args=(
              "$RELEASE_TAG" kit-*.tar.gz Kit-*.zip SHA256SUMS
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --title "$title"
              --notes-file ../release-notes.md
            )
            if [[ $prerelease == true ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi
          edit_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --title "$title"
            --notes-file ../release-notes.md
            --draft=false
            --prerelease="$prerelease"
          )
          if [[ $prerelease == false ]]; then
            latest_tag=$(
              gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name
            )
            if git merge-base --is-ancestor "$latest_tag" \
              "${{ needs.verify.outputs.release_sha }}"; then
              edit_args+=(--latest)
            fi
          fi
          gh release edit "${edit_args[@]}"

  announce-release:
    name: Announce release in Slack (Kit MCP smoke test)
    needs: [verify, publish, containers]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.verify.outputs.previous_tag }}
      SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
      SLACK_MCP_URL: ${{ vars.SLACK_MCP_URL }}
      GRAM_ENVIRONMENT: ${{ vars.GRAM_ENVIRONMENT }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: kit-linux-x64
          path: dist
      - name: Post and verify announcement with the released Kit CLI
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GRAM_API_KEY: ${{ secrets.GRAM_API_KEY }}
        shell: bash
        run: |
          for name in OPENROUTER_API_KEY SLACK_CHANNEL_ID SLACK_MCP_URL GRAM_ENVIRONMENT GRAM_API_KEY; do
            if [[ -z ${!name} ]]; then
              echo "::error::Missing required $name for the Slack release smoke test."
              exit 1
            fi
          done

          if [[ ! $SLACK_CHANNEL_ID =~ ^[CG][A-Z0-9]+$ ]]; then
            echo "::error::SLACK_CHANNEL_ID must be a Slack channel ID, not a channel name."
            exit 1
          fi

          # HTTP headers are literal config values, not environment placeholders.
          # Keep the credential-bearing config private and outside the checkout.
          umask 077
          mcp_dir=$(mktemp -d "$RUNNER_TEMP/kit-slack.XXXXXX")
          trap 'rm -rf "$mcp_dir"' EXIT
          export SLACK_MCP_CONFIG="$mcp_dir/mcp.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          url = os.environ["SLACK_MCP_URL"]
          parsed = urlsplit(url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit("SLACK_MCP_URL must be an HTTPS MCP endpoint without URL credentials")
          config = {
              "mcpServers": {
                  "slack": {
                      "type": "http",
                      "description": "Slack: post release announcements and retrieve message permalinks",
                      "url": url,
                      "headers": {
                          "Authorization": "Bearer " + os.environ["GRAM_API_KEY"],
                          "Gram-Environment": os.environ["GRAM_ENVIRONMENT"],
                      },
                  }
              }
          }
          Path(os.environ["SLACK_MCP_CONFIG"]).write_text(json.dumps(config))
          PY
          unset GRAM_API_KEY

          mkdir -p release-kit
          tar -xzf "dist/kit-v${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -C release-kit
          release-kit/kit --version
          prompt="Use the announce-kit-release skill to post release notes for ${PREVIOUS_TAG}..${RELEASE_TAG} to Slack channel ID ${SLACK_CHANNEL_ID}, supplied by the SLACK_CHANNEL_ID environment variable. The checkout is the published release.
          Load the skill with the skill tool, discover the configured slack MCP tools with tool_search, and use only those MCP tools for Slack operations. Do not use shell, curl, or a direct Slack API client as a fallback. Use the supplied channel ID directly; do not search, list, or resolve channels by name.
          This is a noninteractive release smoke test: post directly, do not draft or request confirmation. The bot can post messages but has no channel-history access. Use the skill's restricted-bot verification: inspect the actual message returned by the successful send response, verify its channel matches ${SLACK_CHANNEL_ID}, timestamp and formatting, then retrieve its permalink through MCP. Do not call history tools or message search.
          Do not expose credentials or read the MCP config. If any step fails, report the failing step and exact error without credentials, and do not return a success link. Only after successful posting and verification, respond with just the Slack message permalink on its own line."
          kit_status=0
          release-kit/kit prompt \
            --root "$GITHUB_WORKSPACE" \
            --provider openrouter \
            --model "$RELEASE_NOTES_MODEL" \
            --mcp-config "$SLACK_MCP_CONFIG" \
            "$prompt" \
            > "$mcp_dir/output.txt" || kit_status=$?
          announcement=$(sed '$ { /^session_id: /d; }' "$mcp_dir/output.txt")
          if (( kit_status != 0 )) || [[ ! $announcement =~ ^https://[a-zA-Z0-9-]+\.slack\.com/archives/${SLACK_CHANNEL_ID}/p[0-9]+$ ]]; then
            echo "::error::Kit did not confirm a posted and verified Slack announcement with a permalink (CLI exit code: $kit_status)."
            # Disable both modern and legacy workflow commands in model-controlled output.
            command_token=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
            printf '::stop-commands::%s\n' "$command_token"
            head -c 8192 <<< "$announcement" | sed 's/^/Kit: /'
            # Truncation can remove the last newline; resume on a separate line.
            printf '\n::%s::\n' "$command_token"
            exit 1
          fi
          printf 'Slack release announcement: %s\n' "$announcement" >> "$GITHUB_STEP_SUMMARY"

  container-build:
    name: Build container images (${{ matrix.arch }}, ${{ matrix.family }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: release-container-cache-${{ matrix.arch }}-${{ matrix.family }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            family: gnu
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            family: musl
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            family: gnu
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            family: musl
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Container jobs only need the docker tasks; skip the Rust toolchain install.
      MISE_DISABLE_TOOLS: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/checkout-release-candidate
        with:
          release-sha: ${{ needs.verify.outputs.release_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@v4
      - name: Build and push images by digest
        shell: bash
        env:
          # Tags are applied later by docker:tag from the pushed digests.
          KIT_IMAGE: ""
          CACHE: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}-${{ matrix.family }}
        run: |
          case ${{ matrix.family }} in
            gnu) flavors=(slim bookworm) ;;
            musl) flavors=(alpine) ;;
          esac
          for flavor in "${flavors[@]}"; do
            metadata=$RUNNER_TEMP/$flavor-metadata.json
            cache_to=()
            # slim aliases the bookworm build, whose run also refreshes the cache.
            if [[ $flavor != slim ]]; then
              cache_to=(--cache-to "$CACHE,mode=max,ignore-error=true")
            fi
            mise run docker:build "$flavor" -- \
              --platform ${{ matrix.platform }} \
              --cache-from "$CACHE" ${cache_to[@]+"${cache_to[@]}"} \
              --output type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true \
              --provenance "mode=max,builder-id=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
              --metadata-file "$metadata"
            digest=$(jq -r '."containerimage.digest"' "$metadata")
            [[ $digest == sha256:* ]] || { echo "no image digest for $flavor" >&2; exit 1; }
            mkdir -p "/tmp/digests/$flavor"
            touch "/tmp/digests/$flavor/${digest#sha256:}"
          done
      - name: Upload image digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-digests-${{ matrix.arch }}-${{ matrix.family }}
          path: /tmp/digests
          if-no-files-found: error
          retention-days: 1

  containers:
    name: Publish container image manifests
    needs: [verify, publish, container-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      KIT_IMAGE: ghcr.io/${{ github.repository }}
      KIT_RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      MISE_DISABLE_TOOLS: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: container-digests-*
          path: /tmp/digests
          merge-multiple: true
      - name: Read release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ $RELEASE_TAG == *-* ]]; then
            echo "floating=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest_stable=$(
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          )
          if [[ $RELEASE_TAG == "$newest_stable" ]]; then
            echo "floating=true" >> "$GITHUB_OUTPUT"
          else
            echo "floating=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish slim manifest
        shell: bash
        env:
          KIT_FLOATING_TAGS: ${{ steps.release.outputs.floating }}
        run: |
          mapfile -t digests < <(find /tmp/digests/slim -type f -printf "${IMAGE}@sha256:%f\n")
          mise run docker:tag slim -- "${digests[@]}"

      - name: Publish Bookworm manifest
        shell: bash
        env:
          KIT_FLOATING_TAGS: ${{ steps.release.outputs.floating }}
        run: |
          mapfile -t digests < <(find /tmp/digests/bookworm -type f -printf "${IMAGE}@sha256:%f\n")
          mise run docker:tag bookworm -- "${digests[@]}"

      - name: Publish Alpine manifest
        shell: bash
        env:
          KIT_FLOATING_TAGS: ${{ steps.release.outputs.floating }}
        run: |
          mapfile -t digests < <(find /tmp/digests/alpine -type f -printf "${IMAGE}@sha256:%f\n")
          mise run docker:tag alpine -- "${digests[@]}"

      - name: Verify container package is public
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package=${GITHUB_REPOSITORY#*/}
          visibility=$(
            gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}" \
              --jq .visibility
          )
          if [[ $visibility != public ]]; then
            echo "::error::Set the ${package} container package visibility to public, then rerun this workflow."
            echo "https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}/settings"
            exit 1
          fi
