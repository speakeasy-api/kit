name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-lint
      - run: mise run setup:linux
      - run: mise run test:scripts
      - run: mise run lint

  test-build:
    name: Build tests (${{ matrix.flavor }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: full
            flags: ''
            cache: linux-test
          - flavor: headless
            flags: --no-default-features
            cache: linux-headless
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache }}
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-nextest@0.9.150
      - run: mise run setup:linux
      - name: Compile and archive tests
        env:
          FLAGS: ${{ matrix.flags }}
        run: mise run test:archive -- $FLAGS
      - uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.flavor }}
          path: target/nextest.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Run doctests
        env:
          FLAGS: ${{ matrix.flags }}
        run: mise run test:doc -- $FLAGS
      - if: matrix.flavor == 'full'
        run: |
          mise run build
          mise run test:linux-no-audio -- target/debug/kit
      - if: matrix.flavor == 'headless'
        run: |
          mise run build:headless
          mise run check:linux-audio-linkage -- target/debug/kit
          target/debug/kit --version
          if target/debug/kit --help | grep -qw tui; then
            echo "headless build must not expose the tui command" >&2
            exit 1
          fi

  test-shards:
    name: Tests (${{ matrix.flavor }}, ${{ matrix.partition }})
    needs: test-build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, headless]
        # The unpartitioned control separates nextest gains from sharding gains.
        partition: ['hash:1/2', 'hash:2/2', 'hash:1/1']
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: jdx/mise-action@v4
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-nextest@0.9.150
      - uses: actions/download-artifact@v4
        with:
          name: tests-${{ matrix.flavor }}
          path: ${{ runner.temp }}/tests
      - name: Run archived tests
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          mise run test:archive-run -- \
            --archive-file "$RUNNER_TEMP/tests/nextest.tar.zst" \
            --extract-to "$GITHUB_WORKSPACE" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --partition "$PARTITION" \
            --status-level fail --final-status-level fail

  macos-rust:
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-rust
      - name: Build shared Kit helper
        shell: bash
        run: |
          mise run build:release -- --target aarch64-apple-darwin
          tar -czf "$RUNNER_TEMP/kit.tar.gz" -C target/aarch64-apple-darwin/release kit
      - uses: actions/upload-artifact@v4
        with:
          name: macos-kit-helper
          compression-level: 0
          path: ${{ runner.temp }}/kit.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos-desktop:
    needs: macos-rust
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: jdx/mise-action@v4
      - name: Check generated Xcode project drift
        run: mise run macos:check
      - uses: actions/download-artifact@v4
        with:
          name: macos-kit-helper
          path: ${{ runner.temp }}/macos-kit-helper
      - name: Install shared Kit helper
        shell: bash
        run: |
          mkdir -p target/aarch64-apple-darwin/release target/debug
          tar -xzf "$RUNNER_TEMP/macos-kit-helper/kit.tar.gz" -C target/aarch64-apple-darwin/release
          test -x target/aarch64-apple-darwin/release/kit
          # The lifecycle XCTest discovers a local development helper at this path.
          ln -sf ../aarch64-apple-darwin/release/kit target/debug/kit
      - name: Run Swift tests and real Kit lifecycle smoke
        shell: bash
        env:
          KIT_DERIVED_DATA: ${{ runner.temp }}/DesktopDerivedData
          KIT_BINARY: ${{ github.workspace }}/target/aarch64-apple-darwin/release/kit
        run: |
          stale="$KIT_DERIVED_DATA/Build/Products/Debug/Kit.app/Contents/Helpers/kit"
          mkdir -p "$(dirname "$stale")"
          printf stale > "$stale"
          chmod +x "$stale"
          # The helper was downloaded above; skip the debug cargo build the task normally depends on.
          mise run --skip-deps macos:test
          cmp target/aarch64-apple-darwin/release/kit "$stale"
      - name: Validate Release archive and bundled helper
        shell: bash
        env:
          KIT_ARCHIVE_PATH: ${{ runner.temp }}/Kit.xcarchive
        run: |
          mise run macos:archive
          app="$KIT_ARCHIVE_PATH/Products/Applications/Kit.app"
          helper="$app/Contents/Helpers/kit"
          test "$(lipo -archs "$app/Contents/MacOS/Kit")" = arm64
          test "$(lipo -archs "$helper")" = arm64
          cmp target/aarch64-apple-darwin/release/kit "$helper"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.speakeasy.kit.desktop
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"

  # Preserve the existing required check while lint and tests run concurrently.
  test:
    if: always()
    needs: [lint, test-build, test-shards]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require lint and Rust tests
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.test-build.result }}
          TEST_RESULT: ${{ needs.test-shards.result }}
        run: test "$LINT_RESULT" = success && test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success
