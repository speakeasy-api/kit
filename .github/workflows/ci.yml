name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Validate Conventional Commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^[a-z][a-z0-9-]*(\([^()]+\))?(!)?: .+'
          if [[ ! $PR_TITLE =~ $pattern ]]; then
            echo "Pull request titles must use Conventional Commit syntax." >&2
            echo "Examples: feat: add a feature, fix(api): correct behavior, feat!: break compatibility" >&2
            exit 1
          fi
      - uses: useblacksmith/checkout@v1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: scripts/tests/test_next_release_version.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  macos-desktop:
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-desktop
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          scripts/install-xcodegen.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check generated Xcode project drift
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/tests/test_generate_acp_swift.py
          scripts/generate-acp-swift.py --check
          PATH="$RUNNER_TEMP/bin:$PATH" scripts/generate-macos-project.sh
          git diff --exit-code -- macos/KitDesktop/Generated macos/KitDesktop.xcodeproj
      # Reuse one release helper for the Debug smoke test and the Release archive.
      - name: Build real Kit helper
        shell: bash
        run: |
          cargo build --locked --release --target aarch64-apple-darwin --bin kit
          # The lifecycle XCTest discovers a local development helper at this path.
          mkdir -p target/debug
          ln -sf ../aarch64-apple-darwin/release/kit target/debug/kit
      - name: Run Swift tests and real Kit lifecycle smoke
        shell: bash
        run: |
          derived="$RUNNER_TEMP/DesktopDerivedData"
          stale="$derived/Build/Products/Debug/Kit.app/Contents/Helpers/kit"
          mkdir -p "$(dirname "$stale")"
          printf stale > "$stale"
          chmod +x "$stale"
          xcodebuild test -quiet \
            -project macos/KitDesktop.xcodeproj \
            -scheme KitDesktop \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$derived" \
            KIT_BINARY="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/kit" \
            CODE_SIGNING_ALLOWED=NO
          cmp target/aarch64-apple-darwin/release/kit "$stale"
      - name: Validate Release archive and bundled helper
        shell: bash
        run: |
          archive="$RUNNER_TEMP/Kit.xcarchive"
          xcodebuild archive -quiet \
            -project macos/KitDesktop.xcodeproj \
            -scheme KitDesktop \
            -configuration Release \
            -archivePath "$archive" \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
          app="$archive/Products/Applications/Kit.app"
          helper="$app/Contents/Helpers/kit"
          test "$(lipo -archs "$app/Contents/MacOS/Kit")" = arm64
          test "$(lipo -archs "$helper")" = arm64
          cmp target/aarch64-apple-darwin/release/kit "$helper"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.speakeasy.kit.desktop
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
