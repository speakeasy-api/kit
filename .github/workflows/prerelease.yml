name: prerelease

on:
  push:
    tags:
      - "v*-pre*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Verify prerelease tag matches Cargo version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          case "$GITHUB_REF_NAME" in
            "v${version}-pre"|"v${version}-pre."*) ;;
            *) echo "expected v${version}-pre or v${version}-pre.N" >&2; exit 1 ;;
          esac
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  linux-x64:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: x86_64-unknown-linux-gnu
      - name: Build and package
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          mkdir -p stage dist
          cp target/x86_64-unknown-linux-gnu/release/kit stage/kit
          stage/kit --version
          tar -C stage -czf "dist/kit-v${version}-x86_64-unknown-linux-gnu.tar.gz" kit
      - uses: actions/upload-artifact@v4
        with:
          name: kit-prerelease-linux-x64
          path: dist/*
          if-no-files-found: error

  macos-arm64:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-darwin
      - name: Build and package without Developer ID signing
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo build --locked --release --target aarch64-apple-darwin
          mkdir -p stage dist
          cp target/aarch64-apple-darwin/release/kit stage/kit
          stage/kit --version
          tar -C stage -czf "dist/kit-v${version}-aarch64-apple-darwin.tar.gz" kit
      - uses: actions/upload-artifact@v4
        with:
          name: kit-prerelease-macos-arm64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [linux-x64, macos-arm64]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.KIT_RELEASES_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kit-prerelease-*
          path: dist
          merge-multiple: true
      - name: Publish unsigned prerelease
        shell: bash
        run: |
          test -n "$GH_TOKEN" || { echo "missing repository secret: KIT_RELEASES_TOKEN" >&2; exit 1; }
          cd dist
          sha256sum kit-*.tar.gz > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo danielkov/kit-releases >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" kit-*.tar.gz SHA256SUMS \
              --clobber --repo danielkov/kit-releases
          else
            gh release create "$GITHUB_REF_NAME" kit-*.tar.gz SHA256SUMS \
              --repo danielkov/kit-releases \
              --prerelease \
              --title "Kit ${GITHUB_REF_NAME#v}" \
              --notes "Prebuilt prerelease binaries. The macOS binary is not Developer ID signed or notarized."
          fi
