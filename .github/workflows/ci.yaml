name: CI

'on':
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Commit or protected tag to validate before publication
        required: true
        type: string
      baseline_ref:
        description: Protected Git baseline ref containing the prior registry
        required: true
        type: string
      attestation_run_id:
        description: Trusted CI run containing the attestation artifact
        required: true
        type: string
      attestation_artifact:
        description: Exact attestation artifact name
        required: true
        type: string
      attestation_workflow_ref:
        description: Exact producer workflow ref bound by the attestations
        required: true
        type: string

permissions:
  contents: read

jobs:
  m003-external:
    name: m003-external-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: [self-hosted, linux, x64, kit-m003]
          - arch: aarch64
            runner: [self-hosted, linux, arm64, kit-m003]
    runs-on: ${{ matrix.runner }}
    environment: m003-external
    timeout-minutes: 720
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify externally provisioned immutable helper and images
        env:
          KIT_TRIAL_AGENT_IMAGE: ${{ vars.KIT_TRIAL_AGENT_IMAGE }}
          KIT_TRIAL_GRADER_IMAGE: ${{ vars.KIT_TRIAL_GRADER_IMAGE }}
          KIT_CONTAINER_LIMIT_PROBE_IMAGE: ${{ vars.KIT_CONTAINER_LIMIT_PROBE_IMAGE }}
          KIT_CONTAINER_NET_PROBE_IMAGE: ${{ vars.KIT_CONTAINER_NET_PROBE_IMAGE }}
          KIT_TEST_CONTAINER_IMAGE: ${{ vars.KIT_TEST_CONTAINER_IMAGE }}
          KIT_CONTAINER_HELPER_SHA256: ${{ vars.KIT_CONTAINER_HELPER_SHA256 }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          test -e /sys/fs/cgroup/cgroup.kill
          grep -qi landlock /proc/kallsyms
          for value in "$KIT_TRIAL_AGENT_IMAGE" "$KIT_TRIAL_GRADER_IMAGE" "$KIT_CONTAINER_LIMIT_PROBE_IMAGE" "$KIT_CONTAINER_NET_PROBE_IMAGE" "$KIT_TEST_CONTAINER_IMAGE" "$KIT_CONTAINER_HELPER_SHA256"; do
            test "${#value}" -eq 71
            test "${value#sha256:}" != "$value"
            test -z "$(printf '%s' "${value#sha256:}" | tr -d '0-9a-f')"
          done
          test "sha256:$(sha256sum /usr/libexec/kit-container-helper | cut -d ' ' -f 1)" = "$KIT_CONTAINER_HELPER_SHA256"
      - name: Run exact M003 trusted-helper gate
        env:
          KIT_TRIAL_AGENT_IMAGE: ${{ vars.KIT_TRIAL_AGENT_IMAGE }}
          KIT_TRIAL_GRADER_IMAGE: ${{ vars.KIT_TRIAL_GRADER_IMAGE }}
          KIT_CONTAINER_LIMIT_PROBE_IMAGE: ${{ vars.KIT_CONTAINER_LIMIT_PROBE_IMAGE }}
          KIT_CONTAINER_NET_PROBE_IMAGE: ${{ vars.KIT_CONTAINER_NET_PROBE_IMAGE }}
          KIT_CONTAINER_NET_ALLOWED_HOST: ${{ vars.KIT_CONTAINER_NET_ALLOWED_HOST }}
          KIT_CONTAINER_NET_ALLOWED_PORT: ${{ vars.KIT_CONTAINER_NET_ALLOWED_PORT }}
          KIT_TEST_CONTAINER_IMAGE: ${{ vars.KIT_TEST_CONTAINER_IMAGE }}
        run: |
          set -eu
          cargo test --locked --test adversarial container_fs::explicitly_requested_runtime_escape_test_requires_real_evidence -- --ignored --exact
          cargo test --locked --test adversarial container_net::explicitly_requested_direct_socket_bypass_test_cannot_skip_missing_evidence -- --ignored --exact
          cargo test --locked --test conformance container_limits::explicitly_requested_actual_bounds_require_all_external_evidence -- --ignored --exact
          cargo test --locked --test conformance container_limits::formatter_measurements_are_all_or_nothing_helper_evidence -- --exact
          cargo test --locked --test conformance edit_format::formatter_rejects_requested_provenance_that_differs_from_measured_bytes -- --exact
          cargo test --locked --test conformance edit_format::formatter_rejects_absent_authoritative_measurements -- --exact
          cargo test --locked --test fault process_reap
          cargo test --locked --test fault exec_cancel
          cargo test --locked --test conformance harness_selfcheck
          cargo test --locked --test adversarial trial_grader_access::production_helper_denies_agent_grader_input_reads_and_writes -- --ignored --exact
          cargo test --locked --test adversarial trial_grader_access::production_protocol_rejects_all_canary_encodings_before_persistence -- --ignored --exact
          cargo test --locked --test adversarial trial_grader_access::one_thousand_production_helper_trials_have_fresh_attested_writable_leases -- --ignored --exact
      - name: Run exact M004 production-core evidence gate
        env:
          KIT_TRIAL_AGENT_IMAGE: ${{ vars.KIT_TRIAL_AGENT_IMAGE }}
          KIT_TRIAL_GRADER_IMAGE: ${{ vars.KIT_TRIAL_GRADER_IMAGE }}
          KIT_CORE_EVIDENCE_ROOT: ${{ runner.temp }}/kit-core-evidence
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          mkdir -p "$KIT_CORE_EVIDENCE_ROOT"
          cargo test --locked --test adversarial trial_grader_access::production_grader_probe_rejects_every_channel_and_encoding_before_persistence -- --ignored --exact
          cargo test --locked --test adversarial trial_grader_access::production_core_harness_calibrates_and_reproduces_through_trusted_helper -- --ignored --exact
          printf '%s\n' \
            "schema_version=1" \
            "commit=$GITHUB_SHA" \
            "architecture=$EXPECTED_ARCH" \
            "canary_command=cargo test --locked --test adversarial trial_grader_access::production_grader_probe_rejects_every_channel_and_encoding_before_persistence -- --ignored --exact" \
            "command=cargo test --locked --test adversarial trial_grader_access::production_core_harness_calibrates_and_reproduces_through_trusted_helper -- --ignored --exact" \
            "agent_image=$KIT_TRIAL_AGENT_IMAGE" \
            "grader_image=$KIT_TRIAL_GRADER_IMAGE" \
            > "$KIT_CORE_EVIDENCE_ROOT/attestation.txt"
          sha256sum "$KIT_CORE_EVIDENCE_ROOT/attestation.txt" > "$KIT_CORE_EVIDENCE_ROOT/attestation.sha256"
      - name: Upload trusted M004 production-core evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m004-production-core-${{ matrix.arch }}-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/kit-core-evidence/
      - name: Emit M004 production-core release attestations
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          KIT_TRIAL_AGENT_IMAGE: ${{ vars.KIT_TRIAL_AGENT_IMAGE }}
          KIT_TRIAL_GRADER_IMAGE: ${{ vars.KIT_TRIAL_GRADER_IMAGE }}
          KIT_CORE_EVIDENCE_ROOT: ${{ runner.temp }}/kit-core-evidence
        run: |
          set -eu
          printf '%s\n' \
            "runner_os=$RUNNER_OS" \
            "runner_arch=$RUNNER_ARCH" \
            "expected_arch=$EXPECTED_ARCH" \
            "agent_image=$KIT_TRIAL_AGENT_IMAGE" \
            "grader_image=$KIT_TRIAL_GRADER_IMAGE" \
            > "$RUNNER_TEMP/m004-core-environment.txt"
          python3 scripts/emit_release_attestations.py \
            --artifact "$KIT_CORE_EVIDENCE_ROOT" \
            --environment "$RUNNER_TEMP/m004-core-environment.txt" \
            --output "$RUNNER_TEMP/m004-core-release-attestations" \
            --commit-sha "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --filename-prefix "core-$EXPECTED_ARCH" \
            --evidence-id EV-M004-W12-C-001 \
            --evidence-id EV-M004-W12-C-002 \
            --evidence-id EV-M004-W12-C-003 \
            --evidence-id EV-M004-W12-C-004
      - name: Upload M004 production-core release attestations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m004-release-core-${{ matrix.arch }}-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/m004-core-release-attestations/*.json

  m003-platform-source:
    name: m003-source-${{ matrix.cell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: linux-x86_64
            runner: ubuntu-24.04
            command: cargo test --locked --test adversarial local_sandbox && cargo test --locked --test adversarial path_escape && cargo test --locked --test fault process_reap
          - cell: macos-arm64
            runner: macos-15
            command: cargo test --locked --test adversarial local_sandbox && cargo test --locked --test adversarial path_escape && cargo test --locked --test fault process_reap
          - cell: windows-x86_64
            runner: windows-2025
            command: cargo test --locked --test conformance windows_job_limits && cargo test --locked --test adversarial windows_job
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install 1.94.0 --profile minimal && rustup override set 1.94.0
      - name: Run source/conformance cell without claiming external isolation
        shell: bash
        env:
          CELL_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$CELL_COMMAND"
  w07-macos-release:
    name: w07-macos-release
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal && rustup override set 1.94.0
      - name: Build and test the release W07 worker
        run: |
          test "$(uname -s)" = Darwin
          cargo build --release --locked --manifest-path eval/corpora/retrieval/Cargo.toml
          cargo test --release --locked --manifest-path eval/corpora/retrieval/Cargo.toml --test startup --test worker_shape
  m004-dogfood:
    name: m004-trusted-linux-dogfood
    runs-on: [self-hosted, linux, x64, kit-m004]
    environment: m004-external
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preflight externally supplied production pins
        env:
          KIT_TRUSTED_PRODUCTION_DOGFOOD: '1'
          KIT_DOGFOOD_CHECK_IMAGE: ${{ vars.KIT_DOGFOOD_CHECK_IMAGE }}
          KIT_NATIVE_CONTAINER_IMAGE: ${{ vars.KIT_NATIVE_CONTAINER_IMAGE }}
          KIT_DOGFOOD_TOOL_DIGEST: ${{ vars.KIT_DOGFOOD_TOOL_DIGEST }}
          KIT_DOGFOOD_CONFIG_DIGEST: ${{ vars.KIT_DOGFOOD_CONFIG_DIGEST }}
          KIT_CONTAINER_HELPER_SHA256: ${{ vars.KIT_CONTAINER_HELPER_SHA256 }}
        run: |
          cargo build --locked --bin kit
          cargo test --locked --manifest-path dogfood-harness/Cargo.toml trusted_linux_production_preflight -- --ignored --exact
      - name: Run trusted production dogfood
        env:
          KIT_TRUSTED_PRODUCTION_DOGFOOD: '1'
          KIT_DOGFOOD_CHECK_IMAGE: ${{ vars.KIT_DOGFOOD_CHECK_IMAGE }}
          KIT_NATIVE_CONTAINER_IMAGE: ${{ vars.KIT_NATIVE_CONTAINER_IMAGE }}
          KIT_DOGFOOD_TOOL_DIGEST: ${{ vars.KIT_DOGFOOD_TOOL_DIGEST }}
          KIT_DOGFOOD_CONFIG_DIGEST: ${{ vars.KIT_DOGFOOD_CONFIG_DIGEST }}
          KIT_CONTAINER_HELPER_SHA256: ${{ vars.KIT_CONTAINER_HELPER_SHA256 }}
          KIT_DOGFOOD_EVIDENCE_BUNDLE: ${{ runner.temp }}/m004-dogfood-evidence
        run: cargo test --locked --manifest-path dogfood-harness/Cargo.toml trusted_linux_production_dogfood_required_for_g04 -- --ignored --exact
      - name: Bind environment, command, and artifact bundle digests
        run: |
          set -eu
          printf '%s\n' \
            'cargo test --locked --manifest-path dogfood-harness/Cargo.toml trusted_linux_production_dogfood_required_for_g04 -- --ignored --exact' \
            > "${RUNNER_TEMP}/m004-dogfood-evidence/command.txt"
          sha256sum \
            "${RUNNER_TEMP}/m004-dogfood-evidence/command.txt" \
            "${RUNNER_TEMP}/m004-dogfood-evidence/manifest.json" \
            > "${RUNNER_TEMP}/m004-dogfood-sha256.txt"
      - name: Emit trusted dogfood release attestations
        env:
          KIT_DOGFOOD_CHECK_IMAGE: ${{ vars.KIT_DOGFOOD_CHECK_IMAGE }}
          KIT_NATIVE_CONTAINER_IMAGE: ${{ vars.KIT_NATIVE_CONTAINER_IMAGE }}
          KIT_CONTAINER_HELPER_SHA256: ${{ vars.KIT_CONTAINER_HELPER_SHA256 }}
        run: |
          set -eu
          printf '%s\n' \
            "runner_os=$RUNNER_OS" \
            "runner_arch=$RUNNER_ARCH" \
            "check_image=$KIT_DOGFOOD_CHECK_IMAGE" \
            "run_image=$KIT_NATIVE_CONTAINER_IMAGE" \
            "helper=$KIT_CONTAINER_HELPER_SHA256" \
            > "$RUNNER_TEMP/m004-dogfood-environment.txt"
          python3 scripts/emit_release_attestations.py \
            --artifact "$RUNNER_TEMP/m004-dogfood-evidence" \
            --environment "$RUNNER_TEMP/m004-dogfood-environment.txt" \
            --output "$RUNNER_TEMP/m004-dogfood-release-attestations" \
            --commit-sha "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --filename-prefix dogfood-linux-x86_64 \
            --evidence-prefix EV-M004-W11-
      - name: Upload trusted dogfood release attestations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m004-release-dogfood-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/m004-dogfood-release-attestations/*.json
      - name: Upload retained trusted dogfood evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m004-dogfood-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/m004-dogfood-evidence/
            ${{ runner.temp }}/m004-dogfood-sha256.txt
  m004-stats:
    name: m004-trusted-production-statistics
    runs-on: [self-hosted, linux, x64, kit-m004]
    environment: m004-external
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate externally retained production statistical bundle
        env:
          KIT_M004_PRODUCTION_STATS_ROOT: ${{ vars.KIT_M004_PRODUCTION_STATS_ROOT }}
        run: |
          set -eu
          test -n "$KIT_M004_PRODUCTION_STATS_ROOT"
          check-jsonschema --schemafile eval/preregistration/schema/v1/preregistration.schema.json "$KIT_M004_PRODUCTION_STATS_ROOT/preregistration.json"
          check-jsonschema --schemafile eval/preregistration/schema/v1/registration.schema.json "$KIT_M004_PRODUCTION_STATS_ROOT/registered-preregistration.json"
          check-jsonschema --schemafile eval/reports/schema/v1/statistical-report.schema.json "$KIT_M004_PRODUCTION_STATS_ROOT/statistical-report.json"
          printf '%s\n' \
            "runner_os=$RUNNER_OS" \
            "runner_arch=$RUNNER_ARCH" \
            "stats_root=$KIT_M004_PRODUCTION_STATS_ROOT" \
            > "$RUNNER_TEMP/m004-stats-environment.txt"
          python3 scripts/emit_release_attestations.py \
            --artifact "$KIT_M004_PRODUCTION_STATS_ROOT" \
            --environment "$RUNNER_TEMP/m004-stats-environment.txt" \
            --output "$RUNNER_TEMP/m004-stats-release-attestations" \
            --commit-sha "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --filename-prefix stats-linux-x86_64 \
            --evidence-id EV-M004-W12-C-005 \
            --require-production-stats
      - name: Upload trusted statistics release attestations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m004-release-stats-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/m004-stats-release-attestations/*.json

  m004-attestations:
    name: m004-release-attestation-bundle
    needs: [m003-external, m004-dogfood, m004-stats]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download exact M004 producer attestations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: m004-release-*-${{ github.sha }}
          path: ${{ runner.temp }}/m004-release-attestations
          merge-multiple: true
      - name: Upload combined M004 governance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m004-release-attestations-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/m004-release-attestations/*.json
  lane:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt
            manifest: ci/lanes/fmt.yaml
            expected_command: cargo fmt --package kit -- --check
          - name: lint
            manifest: ci/lanes/lint.yaml
          - name: unit
            manifest: ci/lanes/unit.yaml
          - name: integration
            manifest: ci/lanes/integration.yaml
          - name: req-lint
            manifest: ci/lanes/req-lint.yaml
          - name: schema-compat
            manifest: ci/lanes/schema-compat.yaml
          - name: fault
            manifest: ci/lanes/fault.yaml
          - name: adversarial
            manifest: ci/lanes/adversarial.yaml
          - name: reproducible-build
            manifest: ci/lanes/reproducible-build.yaml
          - name: licenses
            manifest: ci/lanes/licenses.yaml
          - name: vuln-scan
            manifest: ci/lanes/vuln-scan.yaml
          - name: evidence-report
            manifest: ci/lanes/evidence-report.yaml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy && rustup override set 1.94.0
      - name: Install hash-locked Python dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements/ci-requirements.lock
      - name: Install cargo-deny
        if: matrix.name == 'licenses'
        run: cargo install cargo-deny --version 0.19.8 --locked
      - name: Install cargo-audit
        if: matrix.name == 'vuln-scan'
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Run lane
        env:
          LANE: ${{ matrix.name }}
          LANE_MANIFEST: ${{ matrix.manifest }}
          EXPECTED_COMMAND: ${{ matrix.expected_command }}
          GOVERNANCE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event_name == 'workflow_dispatch' && inputs.baseline_ref || '' }}
          GOVERNANCE_CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import yaml

          lane = os.environ["LANE"]
          manifest = Path(os.environ["LANE_MANIFEST"])
          if manifest != Path("ci/lanes") / f"{lane}.yaml":
              raise SystemExit(f"invalid lane mapping: {lane} -> {manifest}")
          document = yaml.safe_load(manifest.read_text(encoding="utf-8"))
          if document.get("name") != lane or not document.get("commands"):
              raise SystemExit(f"invalid lane manifest: {lane}")
          expected_command = os.environ.get("EXPECTED_COMMAND")
          if expected_command and document["commands"] != [expected_command]:
              raise SystemExit(f"invalid lane command mapping: {lane}")
          for command in document["commands"]:
              print(f"+ {command}", flush=True)
              subprocess.run(command, shell=True, check=True)
          PY
  release-validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.workflow_ref == format('{0}/.github/workflows/ci.yaml@refs/heads/{1}', github.repository, github.event.repository.default_branch)
    needs: [lane, m003-external, m004-dogfood, m004-stats, m004-attestations, w07-macos-release]
    runs-on: ubuntu-24.04
    environment: release-validation
    outputs:
      candidate_sha: ${{ steps.resolve-refs.outputs.candidate_sha }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out protected governance validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: validator
          fetch-depth: 0
          persist-credentials: false
      - name: Check out candidate separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install protected validator dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r validator/requirements/ci-requirements.lock
      - name: Resolve explicit candidate and baseline SHAs
        id: resolve-refs
        env:
          REQUESTED_BASELINE: ${{ inputs.baseline_ref }}
        run: |
          test -n "$REQUESTED_BASELINE"
          CANDIDATE_SHA=$(git -C candidate rev-parse --verify HEAD^{commit})
          BASELINE_SHA=$(git -C candidate rev-parse --verify "$REQUESTED_BASELINE^{commit}")
          test "$CANDIDATE_SHA" != "$BASELINE_SHA"
          git -C candidate merge-base --is-ancestor "$BASELINE_SHA" "$CANDIDATE_SHA"
          printf 'CANDIDATE_SHA=%s\nBASELINE_SHA=%s\n' "$CANDIDATE_SHA" "$BASELINE_SHA" >> "$GITHUB_ENV"
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Download specified trusted attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_RUN_ID: ${{ inputs.attestation_run_id }}
          ATTESTATION_ARTIFACT: ${{ inputs.attestation_artifact }}
        run: |
          test -n "$ATTESTATION_RUN_ID"
          test -n "$ATTESTATION_ARTIFACT"
          mkdir -p "$RUNNER_TEMP/kit-attestations"
          gh run download "$ATTESTATION_RUN_ID" --name "$ATTESTATION_ARTIFACT" --dir "$RUNNER_TEMP/kit-attestations"
      - name: Run protected strict governance against candidate
        working-directory: candidate
        env:
          KIT_ATTESTATION_DIR: ${{ runner.temp }}/kit-attestations
          KIT_TRUSTED_ATTESTATION_SHA256: ${{ secrets.KIT_TRUSTED_ATTESTATION_SHA256 }}
          KIT_ATTESTATION_RUN_ID: ${{ inputs.attestation_run_id }}
          KIT_ATTESTATION_WORKFLOW_REF: ${{ inputs.attestation_workflow_ref }}
        run: |
          test -n "$KIT_ATTESTATION_RUN_ID"
          test -n "$KIT_ATTESTATION_WORKFLOW_REF"
          export GITHUB_SHA="$CANDIDATE_SHA"
          python3 ../validator/scripts/generate_registry.py --root "$PWD" --check
          python3 ../validator/scripts/dashboard_lint.py --root "$PWD" --release
          if python3 ../validator/scripts/validate_milestone.py M001 --release; then
            echo "local milestone attestations were incorrectly accepted for release" >&2
            exit 1
          fi
          if python3 ../validator/scripts/validate_milestone.py M002 --release; then
            echo "local M002 attestations were incorrectly accepted for release" >&2
            exit 1
          fi
          if python3 ../validator/scripts/validate_milestone.py M003 --release; then
            echo "local M003 attestations were incorrectly accepted for release" >&2
            exit 1
          fi
          if python3 ../validator/scripts/validate_milestone.py M004 --release; then
            echo "local M004 attestations were incorrectly accepted for release" >&2
            exit 1
          fi
          python3 ../validator/scripts/verify_pins.py --root "$PWD" --release
          python3 ../validator/scripts/req_lint.py \
            --registry-dir requirements/registry.d \
            --rfc RFC.md \
            --inventory requirements/source-inventory.yaml \
            --id-ledger requirements/id-ledger.yaml \
            --baseline-ref "$BASELINE_SHA" \
            --candidate-ref "$CANDIDATE_SHA" \
            --attestation-dir "$KIT_ATTESTATION_DIR" \
            --aggregate --release-candidate

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.workflow_ref == format('{0}/.github/workflows/ci.yaml@refs/heads/{1}', github.repository, github.event.repository.default_branch) && startsWith(inputs.candidate_ref, 'refs/tags/v')
    needs: [lane, release-validate]
    runs-on: ubuntu-24.04
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Publish validated GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CANDIDATE_SHA: ${{ needs.release-validate.outputs.candidate_sha }}
        run: |
          CANDIDATE_TAG=${CANDIDATE_REF#refs/tags/}
          test "$CANDIDATE_TAG" != "$CANDIDATE_REF"
          gh release create "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$CANDIDATE_SHA" --generate-notes
