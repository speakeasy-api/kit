[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = [
  # Mozilla CA data used only by rustls-platform-verifier's wasm fallback.
  { allow = ["CDLA-Permissive-2.0"], name = "webpki-root-certs", version = "=1.0.9" },
]

[licenses.private]
ignore = true
