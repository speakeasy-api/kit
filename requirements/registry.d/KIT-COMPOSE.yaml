- id: KIT-COMPOSE-001
  record_class: requirement
  modality: SHOULD NOT
  title: Avoid composition for exploratory investigation
  atomic_text: Composition SHOULD NOT be the default for exploratory investigation where each observation changes the next question.
  source_section: §16.1 Purpose
  source_anchor: RFC.md:643
  source_quote: Composition SHOULD NOT be the default for exploratory investigation where each observation changes the next question, approval-sensitive effects, or a single cheap call.
