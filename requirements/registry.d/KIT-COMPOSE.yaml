- id: KIT-COMPOSE-004
  record_class: requirement
  modality: SHOULD
  title: Aggregate composition output
  atomic_text: Composition programs SHOULD aggregate source records before returning evidence.
  source_section: §16.4 Output minimization
  source_anchor: RFC.md:675
  source_quote: Only the final selected value and necessary diagnostics enter model context. The full execution graph and nested results remain available as artifacts and events. Programs SHOULD aggregate, assert, and return compact evidence rather than source records.
