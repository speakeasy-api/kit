- id: KIT-ACP-002
  record_class: requirement
  modality: MAY
  title: Optimize in-process ACP children
  atomic_text: An in-process agentkit child MAY be optimized internally when its durable behavior is normalized to the ACP child-run contract.
  source_section: §23.3 ACP subagents
  source_anchor: RFC.md:977
  source_quote: Kit acts as ACP client to the subagent. This makes third-party coding agents replaceable and observable. An in-process agentkit child MAY be optimized internally, but its durable behavior is normalized to the same child-run contract.
  source_fingerprint: 77e1dc236adbf8cd190e2ee8ee3aabc73671c42b60fe8c499b511b6d7415dc03
  introduced_revision: f1893b56e9fba01fcf49c64c3cdf65dfdc7c253a
  status: proposed
  supersedes: null
  tombstone_reason: null
  area: KIT-ACP
  applicability: pending_voi
  interpretation: An in-process optimization is selectable only after equivalence tests show the same durable child-run events, grants, outcomes, and artifacts as ACP execution.
