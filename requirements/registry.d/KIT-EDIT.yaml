- id: KIT-EDIT-002
  record_class: requirement
  modality: MUST NOT
  title: Isolate staged LSP buffers
  atomic_text: Kit MUST NOT expose staged edit buffers to the live workspace LSP.
  source_section: §18.3 Edit transaction
  source_anchor: RFC.md:749
  source_quote: For staged diagnostics, Kit sends versioned staged buffers to an isolated LSP session or shadow workspace using `didOpen`/`didChange`, collects responses tied to those document versions, then closes or discards the shadow state. It MUST NOT expose staged buffers to the live workspace LSP. If a language server cannot diagnose shadow content safely, pre-commit LSP diagnostics are unavailable for that adapter; compiler checks run in the copy-on-write execution view and live diagnostics are collected only after commit.
  source_fingerprint: 30596e2199dcbcc0c6f5c53ba3ab2a2a6bfe674e25fb465be727778ed43be401
  introduced_revision: f1893b56e9fba01fcf49c64c3cdf65dfdc7c253a
  status: proposed
  supersedes: null
  tombstone_reason: null
  area: KIT-EDIT
  applicability: mandatory
  interpretation: Pre-commit buffers use an isolated LSP session or shadow workspace and never mutate the live session.
  acceptance_criteria:
  - cargo test --test conformance staged_lsp_isolation -- --exact exits 0 with 1 passed and 0 failed
