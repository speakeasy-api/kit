- id: KIT-VERIFY-001
  record_class: requirement
  modality: SHOULD
  title: Reproduce defects before editing
  atomic_text: A defect SHOULD be reproduced before editing when feasible.
  source_section: §19.1 Verification ladder
  source_anchor: RFC.md:811
  source_quote: The defect SHOULD be reproduced before editing when feasible. Existing red builds and diagnostics are baselined; decisions use deltas rather than assuming the repository starts clean.
  source_fingerprint: 060ef19d5f6be790f0c18e21695842477e9f4a2a765b13f3a15d48eb8a86cd85
  introduced_revision: f1893b56e9fba01fcf49c64c3cdf65dfdc7c253a
  status: tombstoned
  supersedes: KIT-VERIFY-815
  tombstone_reason: Container-check verification (ladder, affected-check selection, feedback pipeline, loop control) was removed by the RFC amendment at 4e3b5d755034 accompanying DR-0007/DR-0008; built-in verification is the edit-time syntax gate plus optional staged shadow-LSP diagnostics, and further verification is performed by the model through kit_run.
  area: KIT-VERIFY
  applicability: mandatory
  interpretation: The verification event stream records a failing reproducer before the first edit, or records why reproduction is infeasible.
  acceptance_criteria:
