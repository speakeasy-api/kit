- id: KIT-VERIFY-003
  record_class: requirement
  modality: SHOULD
  title: Change strategy after repeated failure
  atomic_text: After two materially identical failures, policy SHOULD trigger re-localization, model escalation, fresh-context review, or user input rather than another equivalent edit.
  source_section: §19.4 Loop control
  source_anchor: RFC.md:842
  source_quote: Each run has budgets for model turns, reasoning, spend, wall time, test time, patch size, repeated failures, and destructive effects. After two materially identical failures, policy SHOULD trigger re-localization, model escalation, a fresh-context reviewer, or user input rather than another equivalent edit.
  source_fingerprint: 61e22b482796fe9c7b9375007bafe8a709d5a06c02a8f3605bd940d7a7faa25c
  introduced_revision: f1893b56e9fba01fcf49c64c3cdf65dfdc7c253a
  status: tombstoned
  supersedes: null
  tombstone_reason: Container-check verification (ladder, affected-check selection, feedback pipeline, loop control) was removed by the RFC amendment at 4e3b5d755034 accompanying DR-0007/DR-0008; built-in verification is the edit-time syntax gate plus optional staged shadow-LSP diagnostics, and further verification is performed by the model through kit_run.
  area: KIT-VERIFY
  applicability: mandatory
  interpretation: A third materially identical failure signature cannot dispatch the same edit strategy without first selecting one of the four named interventions.
  acceptance_criteria:
  - cargo test --test conformance repeated_failure_strategy -- --exact exits 0 with 1 passed and 0 failed
