- id: KIT-CAP-001
  record_class: requirement
  modality: MUST NOT
  title: Keep active bindings immutable
  atomic_text: A catalog change MUST NOT silently replace a schema already bound to an active run.
  source_section: §15.2 Progressive discovery
  source_anchor: RFC.md:610
  source_quote: 'Authorization filtering occurs before search so a principal cannot discover forbidden capabilities. A catalog change updates the index but MUST NOT silently replace a schema already bound to an active run.'
