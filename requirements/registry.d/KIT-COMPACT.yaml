- id: KIT-COMPACT-001
  record_class: requirement
  modality: MUST
  title: Make yield the sole tool call
  atomic_text: The yield control action MUST be the sole tool call in its model round.
  source_section: §22.1 Semantic checkpoint
  source_anchor: RFC.md:835
  source_quote: This is a control action, not user-facing prose. `yield` MUST be the sole tool call in its model round and is accepted only when no tool, approval, auth flow, edit transaction, child merge, or other blocking operation is in flight. A mixed or mid-flight call is rejected with a compact, retryable control error and does not alter context. A valid call ends the current model round; after validation, Kit compacts and returns a small acknowledgment before the next model call. The continuation packet has a model- and task-specific maximum token budget.
  source_fingerprint: b6d93b9c967a46ca65fda063882215d55bd028a4a2ef798c547b7e49c6318afc
  introduced_revision: 4e3b5d755034800f6fd96ebeaf535e3eea40dc0d
  status: proposed
  supersedes: null
  tombstone_reason: null
  area: KIT-COMPACT
  applicability: mandatory
  interpretation: A model round containing yield and any second tool call is rejected without changing context.
  acceptance_criteria:
  - cargo test --test conformance yield_sole_call -- --exact exits 0 with 1 passed and 0 failed
  primary_milestone: M009
  contributing_milestones: []
  dependencies: []
  owner: Compaction owner
  criticality: blocking
  platforms:
  - all
  deployment_tiers:
