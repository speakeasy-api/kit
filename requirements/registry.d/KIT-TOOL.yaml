  source_quote: Kit preserves each capability’s source JSON Schema and declared dialect. Native Kit schemas SHOULD use JSON Schema 2020-12. Under MCP `2025-11-25`, a schema without `$schema` defaults to 2020-12 while an explicit alternate dialect is permitted. Provider adapters project schemas into each provider/model’s accepted subset and reject unsupported constraints rather than silently dropping them. Kit MUST preserve the source schema, normalized internal view, projection, and their digests.
