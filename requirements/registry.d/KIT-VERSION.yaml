- id: KIT-VERSION-001
  record_class: requirement
  modality: MUST
  title: Pin mutable protocol versions
  atomic_text: Mutable protocols MUST be pinned to the exact versions recorded by an experiment or build.
  source_section: §37 References
  source_anchor: RFC.md:1424
  source_quote: Local case studies are primary evidence about the reviewed implementation but are self-authored, not independent validation. Product/vendor documentation establishes current interfaces, not causal quality gains. Mutable protocols, datasets, models, and harnesses MUST be pinned to the exact versions recorded by an experiment or build.
  source_fingerprint: 6f2564346df2c156da21d754d488f8ca760d5d3d3d065c9e062b8cdfa2477a0a
  introduced_revision: 4e3b5d755034800f6fd96ebeaf535e3eea40dc0d
  status: implemented
  supersedes: null
  tombstone_reason: null
  area: KIT-VERSION
  applicability: mandatory
  interpretation: Every mutable protocol dependency or interface revision used by an experiment or build is identified by an exact immutable version in that experiment or build record.
  acceptance_criteria:
  - Running `scripts/verify_pins.sh` exits 0 and reports `unpinned.mutable_protocols=0`.
  - For every mutable protocol entry consumed by an experiment or build, comparing its recorded version with `docs/compatibility/build-manifest.yaml` reports 0 mismatches.
  primary_milestone: PHASE0
  contributing_milestones:
