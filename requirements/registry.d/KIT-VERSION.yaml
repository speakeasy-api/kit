  - scripts/verify_pins.py
  public_contract_links: []
  telemetry_links: []
  evidence_type: conformance
  evidence_id: EV-1.09-C-001
  evidence_job: schema-compat
  expected_result: '`scripts/verify_pins.sh` exits 0 with `unpinned.mutable_protocols=0` and 0 protocol-version mismatches.'
  artifact_digest: null
  environment_digest: null
  versions: null
  latest_result: pending
  revalidation_rule: Re-run when RFC.md:1507, a protocol dependency, a protocol adapter, an experiment manifest schema, or the build manifest changes.
  decision_record: null
