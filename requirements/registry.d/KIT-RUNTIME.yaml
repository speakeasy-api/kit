- id: KIT-RUNTIME-001
  record_class: requirement
  modality: MUST
  title: Isolate concurrent writers
  atomic_text: Multiple writing agents MUST use separate workspaces or copy-on-write snapshots.
  source_section: §21 Parallelism and Speculation
  source_anchor: RFC.md:806
  source_quote: Multiple writing agents MUST use separate workspaces or copy-on-write snapshots. Results merge through reviewed patches, never concurrent writes to one checkout.
  source_fingerprint: 9f2682666d5d15854eb22a6d750b7e25aa0b49aa2f9a8ad8a65c9f5bcbb89a81
  introduced_revision: 4e3b5d755034800f6fd96ebeaf535e3eea40dc0d
  status: proposed
  supersedes: null
  tombstone_reason: null
  area: KIT-RUNTIME
  applicability: mandatory
  interpretation: Scheduler admission rejects a second writer that shares a mutable checkout with another active writer.
  acceptance_criteria:
  - cargo test --test adversarial parallel_writer_isolation -- --exact exits 0 with 1 passed and 0 failed
