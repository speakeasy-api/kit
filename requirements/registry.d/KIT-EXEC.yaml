- id: KIT-EXEC-001
  record_class: requirement
  modality: SHOULD
  title: Linux process cleanup uses dedicated cgroup v2 trees
  atomic_text: Dedicated cgroup v2 trees should own process cleanup on Linux.
  source_section: §25.2 Executor requirements
  source_anchor: RFC.md:1049
  source_quote: On Linux, dedicated cgroup v2 trees and `cgroup.kill` SHOULD own process cleanup.
