  source_section: §17 TOON and Result Encoding
  source_anchor: RFC.md:683
  source_quote: 'TOON is a presentation encoding for JSON-shaped values, not a schema language or canonical wire format. Kit uses each protocol’s required representation: JSON-RPC/JSON for ACP and MCP; a selected A2A 1.0 binding such as JSON-RPC, HTTP+JSON, or gRPC/Protobuf; and separately versioned Kit API and storage representations.'
  source_fingerprint: e93068da522f10adcb2d02c3bf5dd8d7f9755ea45908e3aea7ab13a9e7dbc103
  atomic_text: TOON is a model presentation encoding and not a schema language or canonical wire format.
