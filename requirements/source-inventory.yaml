  classification: testable_promise
  record_id: KIT-A2A-802
  record_class: promise
  source_section: §23.4 A2A peers
  source_anchor: RFC.md:987
  source_quote: A2A is used when the remote party owns its own planning and state. MCP is used when Kit invokes a capability. Raw internal tools are not automatically advertised as A2A skills.
  source_fingerprint: 96feee5269fd5b2df32574554d6e5c3d78d53b94c46b03120e9debaef3a8571f
  atomic_text: A2A is used when the remote party owns planning and state; MCP is used for capability invocation.
- inventory_id: SRC-KIT-A2A-803
  classification: testable_promise
  record_id: KIT-A2A-803
  record_class: promise
  source_section: §23.4 A2A peers
  source_anchor: RFC.md:989
  source_quote: '`ExternalTask` maps A2A `submitted`, `working`, `input-required`, `auth-required`, `completed`, `failed`, `canceled`, and `rejected` states without treating them as local attempt states. `auth-required` creates a durable Kit auth request; `rejected` is terminal. A message-only response is retained as a completed exchange without inventing a remote task. Messages and artifacts are deduplicated by remote identity and sequence/digest. Delegation carries a depth/path token to reject loops. Timeouts and transport loss yield `interrupted`, then bounded retry or user policy; non-idempotent submissions are never blindly duplicated. Cancellation is an idempotent remote request and becomes terminal locally only after peer confirmation; otherwise outcome remains unknown.'
  source_fingerprint: 0d3adcac4eb603f00d2d7e20608627824e3841f969105445d4cbdc96da3cf889
  atomic_text: ExternalTask maps A2A submitted, working, input-required, auth-required, completed, failed, canceled, and rejected states without treating them as local attempt states.
