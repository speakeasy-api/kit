  source_quote: '### 30.4 Statistical method'
  source_fingerprint: c9db742e1a11ec6359c203ba00c8805ab1cd47911dcfd7dbc57d9af522a45da3
  atomic_text: null
- inventory_id: SRC-KIT-EVAL-809
  classification: testable_promise
  record_id: KIT-EVAL-809
  record_class: promise
  source_section: §30.4 Statistical method
  source_anchor: RFC.md:1303
  source_quote: Comparisons are randomized in time blocks, paired at the task/block level where feasible, repeated for stochastic systems, and stratified by repository and task class. Reports include effect sizes and confidence intervals. Sample size, estimand, correctness non-inferiority margin, stopping rule, and multiplicity family are predeclared.
  source_fingerprint: 28c66388ab08f499700754c7aa144c1bd3834c853bbe6cf0434ce6067d66b973
  atomic_text: Comparisons are time-block randomized, paired where feasible, repeated for stochastic systems, and repository and task stratified.
- inventory_id: SRC-KIT-EVAL-810
  classification: testable_promise
  record_id: KIT-EVAL-810
  record_class: promise
  source_section: §30.4 Statistical method
  source_anchor: RFC.md:1303
  source_quote: Comparisons are randomized in time blocks, paired at the task/block level where feasible, repeated for stochastic systems, and stratified by repository and task class. Reports include effect sizes and confidence intervals. Sample size, estimand, correctness non-inferiority margin, stopping rule, and multiplicity family are predeclared.
  source_fingerprint: 28c66388ab08f499700754c7aa144c1bd3834c853bbe6cf0434ce6067d66b973
  atomic_text: Sample size, estimand, non-inferiority margin, stopping rule, and multiplicity family are predeclared.
- inventory_id: SRC-KIT-EVAL-811
  classification: testable_promise
  record_id: KIT-EVAL-811
  record_class: promise
  source_section: §30.4 Statistical method
  source_anchor: RFC.md:1305
  source_quote: With one binary pair per task, exact McNemar is appropriate. With repeated trials or tasks clustered by repository, Kit analyzes task-level paired summaries or uses a hierarchical model, GEE, or repository-then-task cluster bootstrap/randomization that retains all trials. Cost and latency use paired bootstrap or randomization tests; tail quantiles receive bootstrap intervals. Multiple confirmatory comparisons are corrected. Non-inferiority is claimed only when the appropriate one-sided confidence bound excludes the margin.
  source_fingerprint: e4103cde2e8544e3d73ee66ffba88259ea9c0fa3aa165bf52071ff7aecf92b46
  atomic_text: Repeated and clustered trials use task summaries or cluster-aware models, bootstrap, or randomization.
- inventory_id: SRC-KIT-EVAL-812
  classification: testable_promise
  record_id: KIT-EVAL-812
  record_class: promise
  source_section: §30.4 Statistical method
  source_anchor: RFC.md:1305
  source_quote: With one binary pair per task, exact McNemar is appropriate. With repeated trials or tasks clustered by repository, Kit analyzes task-level paired summaries or uses a hierarchical model, GEE, or repository-then-task cluster bootstrap/randomization that retains all trials. Cost and latency use paired bootstrap or randomization tests; tail quantiles receive bootstrap intervals. Multiple confirmatory comparisons are corrected. Non-inferiority is claimed only when the appropriate one-sided confidence bound excludes the margin.
  source_fingerprint: e4103cde2e8544e3d73ee66ffba88259ea9c0fa3aa165bf52071ff7aecf92b46
  atomic_text: Confirmatory comparisons correct multiplicity and claim non-inferiority only when the one-sided bound excludes the margin.
- inventory_id: SRC-KIT-EVAL-813
  classification: testable_promise
  record_id: KIT-EVAL-813
  record_class: promise
  source_section: §30.4 Statistical method
  source_anchor: RFC.md:1307
  source_quote: HumanEval `pass@k` is used only for a fixed candidate-sampling policy, with estimator and sample count reported; it assumes an oracle can recognize a passing candidate. Adaptive retries, repair turns, and verifier-selected candidates are evaluated end to end as `resolution@budget`, including selection errors and all costs. `pass^k` is used only for the predeclared probability that all `k` fresh runs of one fixed policy succeed and is estimated empirically rather than replaced with `(pass@1)^k` without an independence argument.
  source_fingerprint: add017141ccf071f346980791eb42ea4116109a6fde4c748344f62d41978ce99
  atomic_text: Adaptive retries and verifier selection are evaluated end to end as resolution at budget including selection errors and all costs.
