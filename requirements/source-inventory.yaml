- inventory_id: SRC-KIT-API-800
  classification: testable_promise
  record_id: KIT-API-800
  record_class: promise
  source_section: §27.1 Transport
  source_anchor: RFC.md:1086
  source_quote: Kit exposes a versioned HTTP JSON API described by OpenAPI. Every transport is authenticated and every resource, event, terminal, and artifact is authorized to a principal/project. Local Unix sockets use state-root permissions and peer credentials plus a session token where needed. Loopback HTTP uses a random bearer credential and strict Origin/Host checks. Remote HTTP and ACP entry points require caller authentication through mTLS identity or validated OAuth/OIDC bearer tokens with issuer, audience, expiry, revocation, and principal mapping; server-authenticated TLS alone is insufficient. Server-sent events provide resumable event streams. WebSocket is reserved for bidirectional terminal attachment.
  source_fingerprint: bcbb6299098c0ea464aad65a4784b24f2124f8711eb6a39e06ca054d38bd937d
  atomic_text: Kit exposes an authenticated versioned HTTP JSON API described by OpenAPI.
