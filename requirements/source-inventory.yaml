- inventory_id: SRC-KIT-AGENTKIT-806
  classification: testable_promise
  record_id: KIT-AGENTKIT-806
  record_class: promise
  source_section: §9 Relationship to Agentkit
  source_anchor: RFC.md:236
  source_quote: The reviewed agentkit loop validates transcript invariants only after mutators return. Kit therefore requires an agentkit post-validation, fallible checkpoint hook before semantic compaction is enabled. A mutator writes only a candidate artifact; the hook atomically promotes the validated final transcript/checkpoint before the next model call. Until that hook exists, Kit may perform only structural mutations whose complete invariants it independently duplicates and versions.
  source_fingerprint: b7e8d24d1de16b1ee0efb0105cfd82c1fcc6e63c9e1bc8d767da125c90491992
  atomic_text: Semantic compaction requires an agentkit post-validation fallible checkpoint hook.
