- inventory_id: SRC-KIT-COMPACT-823
  classification: testable_promise
  record_id: KIT-COMPACT-823
  record_class: promise
  source_section: §22.4 Automatic fallback
  source_anchor: RFC.md:942
  source_quote: 'Agentkit’s `LoopMutator` and compaction pipeline provide structural and semantic fallback when the model does not call `yield`. Kit first clears low-risk material: stale raw logs, superseded maps, duplicate reads, reasoning parts, and successful command noise. It summarizes only after deterministic eviction is insufficient.'
  source_fingerprint: 2123067ea8a50ae73b0771113e333353318ba308870291d085121f4d9171af7f
  atomic_text: Automatic compaction first removes stale logs, superseded maps, duplicate reads, reasoning parts, and successful command noise before summarizing.
- inventory_id: SRC-KIT-COMPACT-824
  classification: testable_promise
  record_id: KIT-COMPACT-824
  record_class: promise
  source_section: §22.4 Automatic fallback
  source_anchor: RFC.md:944
  source_quote: 'Automatic compaction triggers at a configured fraction of the model context window or a lower learned threshold, before severe saturation, and only at valid mutation points such as after a tool result or turn end. The exact threshold is recorded with each run and has a deterministic default. Compaction quality is tested as state transfer: a resumed agent must retain every requirement, changed file, active failure, rejected approach, and next action.'
  source_fingerprint: 7019d553aaf3d89965d932d067c17af143776cfd8ae0b7f1f3dca6dea9ca5080
  atomic_text: Automatic compaction uses a recorded threshold with deterministic default and runs only at valid mutation points before severe saturation.
