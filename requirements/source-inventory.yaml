  source_section: §34 Delivery Architecture
  source_anchor: RFC.md:1456
  source_quote: 'The product becomes **dogfoodable after `KIT-MILESTONE-004`**: a developer can use the daemon and CLI to run one agent against Kit itself, discover code lexically, apply conflict-safe edits, receive fast verification, inspect events/cost/diffs, cancel work, and recover after restart. Later slices improve intelligence, interoperability, optimization, and deployment strength without redefining that core loop.'
