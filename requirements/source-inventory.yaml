  source_section: §15.2 Progressive discovery
  source_anchor: RFC.md:612
  source_quote: '`tools.bind` returns an immutable binding ID for `(source, capability, schema_digest, authorization_snapshot)`. If the provider supports dynamic deferred registration, Kit exposes that bound definition on the next model request. Otherwise the model calls `tools.invoke(binding_id, input)`, whose generic schema is eager and whose input is validated against the pinned bound schema before broker dispatch. Bindings expire on grant, catalog, or run-policy changes; schema changes require a new binding. This makes invocation and prompt-cache consequences explicit across providers.'
  source_fingerprint: 6174164d64068b4177338fb3e16621a68c7288c7855b1b0b8e2204e3c28d81d1
  atomic_text: tools.bind returns an immutable binding identity for source, capability, schema digest, and authorization snapshot.
