  source_anchor: RFC.md:1078
  source_quote: Each active attempt holds a renewable lease and fencing token. Effects and completion events carry that token. A workspace or run is not reassigned until the executor confirms the old sandbox is quiescent; unconfirmable local or remote effects end as `interrupted` or `failed` with `outcome_unknown`, never `cancelled`. An outcome-unknown interruption blocks automatic resume until reconciliation or an explicit policy decision. On ambiguous crash recovery, Kit inspects the executor where possible and does not blindly repeat non-idempotent work.
