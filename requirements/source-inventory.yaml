  record_id: KIT-ENCODE-802
  record_class: promise
  source_section: §17 TOON and Result Encoding
  source_anchor: RFC.md:685
  source_quote: For model context, Kit chooses among compact JSON, TOON, plain text, tables, and artifact handles using structural eligibility and actual tokenizer measurements. TOON is favored for uniform arrays of objects and rejected when nested or irregular data makes it larger or less clear.
  source_fingerprint: 63344d2282b2df7b468352c94a0cbfb0758f6f42cc576de7e27788791bb79c04
  atomic_text: Model-context encoding is selected by structural eligibility and actual tokenizer measurements.
