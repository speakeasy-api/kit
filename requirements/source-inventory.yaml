  source_anchor: RFC.md:1330
  source_quote: Discovery is evaluated independently from generation using file/symbol recall@k, reciprocal rank, provenance correctness, evidence tokens, time to first relevant symbol, index latency/freshness, and downstream task resolution. Oracle localization estimates the maximum value retrieval improvements can provide.
