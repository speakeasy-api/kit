- inventory_id: SRC-KIT-EDIT-838
  classification: testable_promise
  record_id: KIT-EDIT-838
  record_class: promise
  source_section: §18.5 Concurrent changes
  source_anchor: RFC.md:790
  source_quote: 'Transactional guarantees apply to daemon-exclusive managed workspaces. External modifications advance or invalidate the workspace revision. Attached user checkouts are explicitly cooperative: Kit takes an advisory external-writer lock where supported and rechecks every base hash immediately before materialization, but cannot promise atomicity against an uncooperative editor. A stale edit returns a compact conflict containing changed paths and relevant hunks. Kit never overwrites concurrent user work through a whole-file rewrite without matching its base hash.'
  source_fingerprint: ad151025de6105efc9675c6159fb00acd9950b3689b3fbe15ab4d8f53db0913c
  atomic_text: Transactional guarantees apply to daemon-exclusive managed workspaces.
- inventory_id: SRC-KIT-EDIT-839
  classification: testable_promise
  record_id: KIT-EDIT-839
  record_class: promise
  source_section: §18.5 Concurrent changes
  source_anchor: RFC.md:790
  source_quote: 'Transactional guarantees apply to daemon-exclusive managed workspaces. External modifications advance or invalidate the workspace revision. Attached user checkouts are explicitly cooperative: Kit takes an advisory external-writer lock where supported and rechecks every base hash immediately before materialization, but cannot promise atomicity against an uncooperative editor. A stale edit returns a compact conflict containing changed paths and relevant hunks. Kit never overwrites concurrent user work through a whole-file rewrite without matching its base hash.'
  source_fingerprint: ad151025de6105efc9675c6159fb00acd9950b3689b3fbe15ab4d8f53db0913c
  atomic_text: A stale edit returns a bounded conflict and never overwrites concurrent user work without a matching base hash.
- inventory_id: SRC-KIT-EDIT-840
