- inventory_id: SRC-KIT-ARCH-800
  classification: testable_promise
  record_id: KIT-ARCH-800
  record_class: promise
  source_section: §1 Summary
  source_anchor: RFC.md:17
  source_quote: Kit is not primarily a chat client. It is the durable runtime that owns every thread, run, model turn, tool call, process, terminal, workspace, subagent, peer-agent task, approval, artifact, and compacted continuation. It exposes that state through a public server API. A thin CLI, ACP-compatible editors, a built-in observability page, and third-party clients all use the same runtime.
  source_fingerprint: 0900adcf425fe4c467c27cb9cc1190a49e89f5b3031519294b9ddb3642f1f348
  atomic_text: Kit is a headless coding-agent daemon rather than a chat-client application.
- inventory_id: SRC-KIT-ARCH-801
  classification: testable_promise
  record_id: KIT-ARCH-801
  record_class: promise
  source_section: §1 Summary
  source_anchor: RFC.md:19
  source_quote: 'Kit is written in Rust and built on `agentkit`. Agentkit provides normalized model content, provider adapters, the live agent loop, capability and tool abstractions, MCP and ACP integration, concurrent foreground/background tool-task primitives, reporting, and compaction seams. Kit adds the opinionated coding product around those primitives: durable run and job scheduling, ownership, repository intelligence, optimized prompts and tool surfaces, transactional edits, verification, model routing, process isolation, inter-agent protocols, observability, and rigorous evaluation.'
  source_fingerprint: 5972c71d67eddeb8682e372eb5852ef0c26de62179463029633104475af91484
  atomic_text: Kit is implemented in Rust on agentkit's provider, loop, capability, protocol, task, reporting, and compaction primitives.
