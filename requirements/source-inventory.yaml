  source_section: §23.2 ACP clients
  source_anchor: RFC.md:962
  source_quote: Kit exposes stable ACP protocol version 1 so editors and lightweight clients can create sessions, send prompts, receive streamed messages/tool updates/diffs, resolve permissions, and use supported filesystem or terminal callbacks. Durable reopening uses optional v1 `session/load` only when negotiated and implemented. The reviewed `agentkit-acp` headless runtime does not yet implement durable load semantics, so Kit must add them. ACP session IDs map to Kit threads and runs, not directly to process-local `LoopDriver` state.
  source_fingerprint: 19b5d12ef861dd28eafca642ffca9577fc848cfad4e12fee6ca6c45ace955c57
  atomic_text: Kit exposes stable ACP v1 sessions, prompts, streamed updates, permissions, and supported filesystem or terminal callbacks.
