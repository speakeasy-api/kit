- inventory_id: SRC-KIT-OUTCOME-801
  classification: testable_promise
  record_id: KIT-OUTCOME-801
  record_class: promise
  source_section: §6.1 Primary outcomes
  source_anchor: RFC.md:97-103
  source_quote: 'For a predeclared task population, let `C_i` be the fully loaded cost of the complete product-policy trajectory for task `i`, including failed attempts and verification, and let `Y_i` be one only when the fixed external acceptance rule accepts the final result. The primary production efficiency metric is the ratio of totals:


    ```text

    cost per verified result = sum(C_i) / sum(Y_i)

    ```


    The ratio is undefined when no result is accepted. Reports include repository/task-clustered confidence intervals and never average per-task `C_i / Y_i` values or compare ratios across different task mixes.'
  source_fingerprint: 134543b79cfe1af3d402af76252881bb7e717ca8c1dccd1cbd2ac71d31cb1269
  atomic_text: Production efficiency is computed as total loaded trajectory cost divided by externally accepted results for a predeclared task population.
