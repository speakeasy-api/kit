- inventory_id: SRC-KIT-API-809
  classification: testable_promise
  record_id: KIT-API-809
  record_class: promise
  source_section: §27.1 Transport
  source_anchor: RFC.md:1126
  source_quote: Non-naturally-idempotent mutations, especially run/message creation, MUST include `Idempotency-Key`; first-party clients generate and retain it through the retry window. The key is scoped to authenticated principal, command, and target. The command transaction stores a canonical request digest and response; reuse with different input returns conflict, while pending and terminal outcomes replay. Keys have a declared retention period no shorter than the maximum retry window. Long-running work returns `202 Accepted` with an existing domain resource. Errors use RFC 9457 problem details. IDs are opaque, timestamps are RFC 3339 UTC, and pagination/events use opaque cursors.
  source_fingerprint: 90bc29041f685cd85aef2f809e7df9d8c2d73d2b2427ed183df72b5b7f8c2f40
  atomic_text: First-party clients retain idempotency keys through the retry window.
