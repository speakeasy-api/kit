  source_quote: Kit has no permanent scalar “agent score.” Correctness and safety are gates. Eligible configurations are compared on a Pareto frontier.
  source_fingerprint: 250d84a39c44ec4b1337d2aa8c8e7b00d42458d63f8486c2b1c8100a5483c39e
