  source_section: §9 Relationship to Agentkit
  source_anchor: RFC.md:238
  source_quote: The reviewed loop cannot reconstruct arbitrary in-flight provider sessions, tools, detached tasks, approvals, or auth operations from a transcript alone. Restart is therefore allowed only from persisted safe boundaries. An interrupted in-flight operation becomes a durable error result or `outcome_unknown` before a fresh `LoopDriver` is constructed, unless agentkit later gains a compatible durable-resume contract.
  source_fingerprint: 56a797ecf4303fa8f9a08f695b512e6e2798b2931d31eac2b228af4895a9ad47
  atomic_text: Kit restarts attempts only from persisted safe boundaries.
