- inventory_id: SRC-KIT-EDIT-002
  classification: normative_requirement
  record_id: KIT-EDIT-002
  record_class: requirement
  source_section: §18.3 Edit transaction
  source_anchor: RFC.md:749
  source_quote: For staged diagnostics, Kit sends versioned staged buffers to an isolated LSP session or shadow workspace using `didOpen`/`didChange`, collects responses tied to those document versions, then closes or discards the shadow state. It MUST NOT expose staged buffers to the live workspace LSP. If a language server cannot diagnose shadow content safely, pre-commit LSP diagnostics are unavailable for that adapter; compiler checks run in the copy-on-write execution view and live diagnostics are collected only after commit.
  source_fingerprint: 30596e2199dcbcc0c6f5c53ba3ab2a2a6bfe674e25fb465be727778ed43be401
  atomic_text: Kit MUST NOT expose staged edit buffers to the live workspace LSP.
- inventory_id: SRC-KIT-EDIT-832
  classification: testable_promise
  record_id: KIT-EDIT-832
  record_class: promise
  source_section: §18.3 Edit transaction
  source_anchor: RFC.md:751
  source_quote: Multi-file host filesystem writes and database events cannot share one physical transaction. The idempotent manifest states are `staged -> prepared -> materialized -> committed` or `rolled_back`. Any failure before the revision event restores and syncs the complete undo image; after the event, recovery rolls materialization forward. Recovery runs under the mutation lock before an in-process error returns and again at startup before the workspace is exposed. Kit calls the operation transactional only when staging, locking, journaling, and recovery prevent an agent from observing or continuing from a partial logical revision.
  source_fingerprint: db2ad700bcfc5d32f8dfa00d46da9140461495b92eddb70a961d34c5e9f72460
  atomic_text: Edit manifests follow staged, prepared, materialized, committed, or rolled_back states.
- inventory_id: SRC-KIT-EDIT-833
  classification: testable_promise
  record_id: KIT-EDIT-833
  record_class: promise
  source_section: §18.3 Edit transaction
  source_anchor: RFC.md:751
  source_quote: Multi-file host filesystem writes and database events cannot share one physical transaction. The idempotent manifest states are `staged -> prepared -> materialized -> committed` or `rolled_back`. Any failure before the revision event restores and syncs the complete undo image; after the event, recovery rolls materialization forward. Recovery runs under the mutation lock before an in-process error returns and again at startup before the workspace is exposed. Kit calls the operation transactional only when staging, locking, journaling, and recovery prevent an agent from observing or continuing from a partial logical revision.
  source_fingerprint: db2ad700bcfc5d32f8dfa00d46da9140461495b92eddb70a961d34c5e9f72460
  atomic_text: Edit recovery runs under the mutation lock before returning an error and again at startup.
