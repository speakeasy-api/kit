  source_section: §27.2 CLI parity
  source_anchor: RFC.md:1134
  source_quote: The CLI calls the same command/query service as external clients. It has no hidden agent capability. When embedded/local direct calls avoid HTTP serialization, they still pass through identical authorization, validation, event, and lifecycle handlers.
  source_fingerprint: 0a6d8f1ae1af0d627d30961de42e925e8fd513eac4608b3aee4bd107c24dfbad
  atomic_text: The CLI uses the same authorization, validation, event, and lifecycle handlers as external clients.
- inventory_id: SRC-KIT-API-821
  classification: testable_promise
  record_id: KIT-API-821
  record_class: promise
  source_section: §27.2 CLI parity
  source_anchor: RFC.md:1136
  source_quote: The local daemon owns one configured state root and acquires its exclusive lock before migrations or serving. Endpoint and credential discovery use a permission-restricted file in that root. `kit daemon` runs foreground unless explicitly daemonized; CLI auto-start is opt-in and waits for readiness. Graceful shutdown stops admission, checkpoints safe runs, cancels or hands off owned work according to policy, reconciles prepared edits, flushes events, and releases the lock.
  source_fingerprint: 4213f660292bdf1daf2632d4b3a5411705356ff4768068da66ae052c6024201a
  atomic_text: The local daemon acquires the configured state-root lock before migrations or serving.
