  record_class: promise
  source_section: §10.2 Run lifecycle
  source_anchor: RFC.md:282
  source_quote: An attempt has `leased -> executing -> quiescing -> succeeded|failed|interrupted`, with lease loss forcing `quiescing` before another attempt may acquire ownership. State commands use compare-and-set expected versions. Waiting runs may release model capacity but retain their durable lease/resource policy. Terminal states are monotonic. Retries create a new `Attempt`; they do not revive an old one.
