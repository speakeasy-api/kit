  source_quote: For a local child, Kit owns spawn, ACP initialization, session, heartbeat, cancellation, process exit, and cleanup. For a remote ACP endpoint, it owns the authenticated connection and task relationship only. Disconnect triggers bounded reconnect/load where supported; otherwise the child attempt becomes `interrupted`. Cancellation is terminal only after acknowledgment or confirmed local process quiescence; unresolved remote state is `outcome_unknown`.
