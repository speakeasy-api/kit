  source_section: §19.1 Verification ladder
  source_anchor: RFC.md:798-809
  source_quote: 'Kit uses the cheapest high-signal checks first:


    ```text

    patch validity

    -> syntax and formatter

    -> changed-file diagnostics

    -> typecheck or build slice

    -> reproducing/targeted tests

    -> nearby regression tests

    -> affected package/service checks

    -> full suite, security, performance, or integration checks

    ```'
  source_fingerprint: 24839d930c17b0b4c27369019d8528e12fcc3e4e1b3b8a748a54188b30b88e62
  atomic_text: Verification runs cheapest high-signal checks before broader and more expensive checks.
