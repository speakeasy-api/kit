  source_section: §18.4 Auto-verification flag
  source_anchor: RFC.md:765
  source_quote: '`fast` is the default. Path, revision, anchor, syntax, formatter, sandbox, and materialization failures are hard gates and never commit. `targeted` and `full` test/typecheck failures use `on_check_failure: commit|abort`; the default is `commit` so the verified failing edit becomes the next repair revision. With `abort`, checks still run against the staged view but no source edit is materialized. Cancellation before prepare aborts; cancellation after prepare completes recovery before another writer proceeds. The result contains only diagnostic deltas and concise failures, with complete logs in artifacts.'
  source_fingerprint: 8df78875596859a515d54b7e3e0aedf809b03a12c5073f51a9b56d1bf54c8c3f
  atomic_text: The edit verification profile defaults to fast.
