  record_class: requirement
  source_section: §24 Capability Security
  source_anchor: RFC.md:1020
  source_quote: Secrets are opaque handles resolved just in time by the broker. Secret values MUST NOT appear in prompts, events, traces, composition source, retained terminal history, or workspace metadata. They SHOULD NOT appear in process arguments because argv is commonly observable; file descriptors, memory-backed files, environment injection where unavoidable, short-lived credentials, and egress-proxy injection are preferred. If a target program only accepts argv credentials, policy requires explicit approval, redaction at capture boundaries, and the shortest feasible lifetime.
  source_fingerprint: 3fdc8f8d1a68a625c6728a1ee8696f10524679f247e941fa38d2de44f3480223
  atomic_text: Secret values MUST NOT appear in prompts.
