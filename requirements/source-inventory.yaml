- inventory_id: SRC-COVERAGE-0654
  classification: observation
  record_id: null
  record_class: null
  source_section: null
  source_anchor: RFC.md:654
  source_quote: In one local synthetic N+1 scenario, compose was cheaper for all ten tested models and improved mean rubric accuracy, but each model/scenario cell had one repetition. This is consistent exploratory evidence, not a universal result. The same study found composition more expensive on average for exploratory investigation. A separate local study found unfamiliar Runlet could consume substantially more hidden reasoning than shorter Lua while catching errors Lua missed. Kit treats model and task shape as interactions to reproduce with repeated, paired trials.
