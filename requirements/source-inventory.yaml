  source_section: §5.1 Requirement tracking
  source_anchor: RFC.md:89
  source_quote: 'Before implementation begins or this RFC advances beyond Draft, every normative statement MUST receive a stable identifier of the form `KIT-<AREA>-NNN`, and every identifier MUST map to one or more of: a conformance test, an evaluation, an operational assertion, or an explicitly documented manual review. IDs remain stable when text moves; retired requirements are tombstoned rather than reused. CI rejects unregistered normative statements and reports requirement-to-evidence coverage. Delivery acceptance criteria in §34 reference these requirement sets rather than treating prose completion as implementation completion.'
  source_fingerprint: 56695ee9ca085d2148d33d4be950cc702235c61f5155324cbc3ffa473e15961d
  atomic_text: Requirement IDs remain stable when RFC text moves.
