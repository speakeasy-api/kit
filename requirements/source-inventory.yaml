  source_section: §18.5 Concurrent changes
  source_anchor: RFC.md:792
  source_quote: Ordinary `run`, build, formatter, test, LSP, and MCP processes see source read-only and write only to designated build/temp paths. An explicitly source-writable process must acquire the same mutation lock, receives a dedicated overlay, and on exit either promotes a declared diff as one revision or discards it. Kit confirms the old sandbox is quiescent before reassigning a workspace; a lease token alone cannot fence an escaped OS process.
  source_fingerprint: 7ebcfb3d1d43565933b4047838488d826910679807dd05a1bebea9af84c29a6a
  atomic_text: Ordinary run, build, formatter, test, LSP, and MCP processes see source read-only.
