  source_anchor: RFC.md:303
  source_quote: Both stores MUST atomically append one command’s events across affected streams, check expected stream versions, update projections and the idempotency record, assign a store-wide monotonic `commit_position`, and increment monotonic fencing counters. Lease acquisition and expiry use authoritative store time; fencing tokens never derive from timestamps. `(stream, sequence)` and `commit_position` are unique. Commit positions are assigned under a commit-serialization lock and published only after commit, or readers use a committed-prefix watermark they cannot advance beyond; a later visible transaction can never make a client skip an earlier one. Event streams resume from an opaque committed-position cursor, not a stream-local sequence.
  source_fingerprint: 69944e9800812553d59d7a2f30868d359bdcfdb4a7f5c9d26b4655a148ec3507
  atomic_text: Readers cannot observe a later transaction while skipping an earlier committed transaction.
