- id: self-hosted-inference-profile
  name: Self-hosted inference profile
  source: RFC.md:1164-1166
  gate: G12
  disposition: pending_voi
  experiment_id: EXP-M012-W12-SELF-HOSTED-PROFILE
  selection_rule: Select only when an existing server and GPU capacity are available and the preregistered end-to-end evaluation satisfies correctness and safety gates while reducing cost or latency with a paired 95 percent confidence interval excluding zero.
  fallback: Pinned hosted provider profiles; clustered and hostile conformance continues without self-hosted inference.
  evidence: null
  requirement_id: KIT-EVAL-825
